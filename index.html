x-height:0;margin:0;pointer-events:none}.headchips{display:flex;flex-direction:column;gap:5px;align-items:flex-end;overflow:hidden;transition:.2s}.headchip{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:1000;color:#eee3ff;white-space:nowrap}.headchip.done{color:#dbfff0;border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.14)}.wrap{max-width:980px;margin:auto;padding:14px}.section{display:none}.section.active{display:block}h2{font-size:24px;line-height:1.05;letter-spacing:-.045em;margin:0 0 12px;font-weight:1000}h3{font-size:18px;margin:0 0 12px;font-weight:950}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 14px 34px rgba(0,0,0,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.hero{background:radial-gradient(circle at 20% 0%,rgba(236,72,153,.3),transparent 35%),radial-gradient(circle at 90% 20%,rgba(139,92,246,.38),transparent 34%),linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.065))}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.two{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}label{display:block;font-size:11px;font-weight:1000;color:#e9ddff;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.08em}input,textarea{width:100%;min-height:48px;padding:13px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.085);color:var(--text);font-size:16px;outline:none}input[type=date],input[type=month]{min-height:44px;padding:10px 9px}.btn{min-height:48px;border:0;border-radius:17px;padding:12px 14px;font-size:15px;font-weight:1000;color:white;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--m));box-shadow:0 14px 28px rgba(168,85,247,.22)}.btn.secondary{background:rgba(255,255,255,.1 plate-columns:repeat(7,1fr);gap:5px}.day{min-height:70px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.06);padding:5px;font-size:11px;overflow:hidden}.day.out{opacity:.45}.day.today{border-color:rgba(236,72,153,.75);box-shadow:0 0 22px rgba(236,72,153,.22)}.day.allgreen{border-color:rgba(74,222,128,.86);box-shadow:0 0 28px rgba(74,222,128,.44)}.num{font-weight:1000;margin-bottom:5px}.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.mark{height:24px;border-radius:9px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1)}.mark svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}.mark.ok{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.68)}.mark.no{background:rgba(251,113,133,.17);border-color:rgba(251,113,133,.42)}.weekday{font-size:9px;text-align:center;color:var(--muted);font-weight:1000}.chip{display:inline-flex;margin:6px 6px 0 0;padding:8px 9px;border-radius:999px;background:rgba(255,255,255,.085);border:1px solid var(--line);font-size:12px;color:#efe7ff}.todo.done{opacity:.62}.todo.done .todo-title{text-decoration:line-through}.todo-title{font-weight:1000}.todo-notes{margin-top:5px;color:var(--muted);font-size:12px}.todo-actions{display:flex;gap:8px;margin-top:10px}.weatherbig{font-size:28px;font-weight:1000}@media(max-width:430px){.wrap{padding:10px 8px 18px}.card{padding:14px}.grid{gap:8px}.tab{flex-basis:62px}.headchip.weather{display:none}.calendar{gap:3px}.day{min-height:58px;padding:3px}.brand{width:43px;height:43px;flex-basis:43px}.title h1{font-size:22px}.topbar.shrink .title h1{font-size:18px}}@media(min-width:700px){.two{grid-template-columns:1fr 1fr}.tabs{max-width:820px;left:50%;transform:translateX(-50%);border-radius:30px 30px 0 0}.day{min-height:92px}}</style></head><body><header id='topbar' class='topbar'><div class='topin'><svg class='brand' viewBox='0 0 100 100'><defs><linearGradient id='lg' x1='0' x2='1' y1='0' y2='1'><stop stop-color='#8b5cf6'/><stop offset='1' stop-color='#ec4899'/></linearGradient></defs><path d='M18 75 40 25l18 50M30 55h22M66 28h13v47H66' stroke='url(#lg)' stroke-width='10'/><path d='M19 76h62' stroke='rgba(255,255,255,.35)' stroke-width='6'/></svg><div class='title'><h1>All In One Fit</h1><p id='headSub'>Loading today...</p></div><div class='headchips'><span id='headScore' class='headchip'>0/3</span><span id='headWeather' class='headchip weather'>Weather</span></div></div></header><main class='wrap'><section id='dashboard' class='section active'></section><section id='gym' class='section'></section><section id='nutrition' class='section'></section><section id='habits' class='section'></section><section id='todo' class='section'></section><section id='calendar' class='section'></section></main><nav class='tabs'><button class='tab active' data-tab='dashboard'><svg viewBox='0 0 24 24'><path d='M4 11.5 12 5l8 6.5'></path><path d='M6.5 10.5V19h11v-8.5'></path><path d='M10 19v-5h4v5'></path></svg><span>Home</span></button><button class='tab' data-tab='gym'><svg viewBox='0 0 24 24'><path d='M3 10v4M6 8v8M9 9v6M15 9v6M18 8v8M21 10v4M6 12h12'></path></svg><span>Gym</span></button><button class='tab' data-tab='nutrition'><svg viewBox='0 0 24 24'><path d='M8.5 6.5c1.8-1.5 4.8-2 7.1-.9 3.2 1.6 4.2 5.5 2.3 8.3-1.9 2.8-5.8 4.1-9.2 3.2C5.4 16.3 4 13.1 4.8 10.2c.4-1.4 1.5-2.7 3.7-3.7z'></path><circle cx='15.8' cy='10' r='1.8'></circle></svg><span>Food</span></button><button class='tab' data-tab='habits'><svg viewBox='0 0 24 24'><path d='M7 7a7 7 0 0 1 10.5 1'></path><path d='M18 4v4h-4'></path><path d='M17 17a7 7 0 0 1-10.5-1'></path><path d='M6 20v-4h4'></path></svg><span>Habits</span></button><button class='tab' data-tab='todo'><svg viewBox='0 0 24 24'><path d='M8 6h11M8 12h11M8 18h11'></path><path d='M4.5 6.2l.9.9 1.6-1.8M4.5 12.2l.9.9 1.6-1.8M4.5 18.2l.9.9 1.6-1.8'></path></svg><span>To-do</span></button><button class='tab' data-tab='calendar'><svg viewBox='0 0 24 24'><path d='M7 4v3M17 4v3M5 8h14'></path><path d='M6 6h12c1 0 1.6.6 1.6 1.6v10.8c0 1-.6 1.6-1.6 1.6H6c-1 0-1.6-.6-1.6-1.6V7.6C4.4 6.6 5 6 6 6z'></path></svg><span>Calendar</span></button></nav><script>(function(){'use strict';const KEY='all_in_one_fit_one_file_v1',$=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));let ui={nutritionDate:today(),habitDate:today(),weatherBusy:false,headerSmall:false};const IC={gym:`<svg viewBox='0 0 24 24'><path d='M3 10v4M6 8v8M9 9v6M15 9v6M18 8v8M21 10v4M6 12h12'></path></svg>`,habits:`<svg viewBox='0 0 24 24'><path d='M7 7a7 7 0 0 1 10.5 1'></path><path d='M18 4v4h-4'></path><path d='M17 17a7 7 0 0 1-10.5-1'></path><path d='M6 20v-4h4'></path></svg>`,protein:`<svg viewBox='0 0 24 24'><path d='M8.5 6.5c1.8-1.5 4.8-2 7.1-.9 3.2 1.6 4.2 5.5 2.3 8.3-1.9 2.8-5.8 4.1-9.2 3.2C5.4 16.3 4 13.1 4.8 10.2c.4-1.4 1.5-2.7 3.7-3.7z'></path><circle cx='15.8' cy='10' r='1.8'></circle></svg>`};function pad(n){return String(n).padStart(2,'0')}function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function today(){return fmt(new Date())}function ymd(s){let a=String(s||today()).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1,12)}function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}function id(){return Math.random().toString(36).slice(2,10)}function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;')}function blank(){return{workouts:[],nutrition:{},habits:[{id:id(),name:'Steps or walk',done:{}},{id:id(),name:'Drink water',done:{}},{id:id(),name:'Sleep routine',done:{}}],todos:[],weather:{},goals:{protein:160,calories:2400,weeklyWorkouts:3}}}function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}function norm(raw){let b=blank(),s=Object.assign(b,raw||{});s.workouts=Array.isArray(s.workouts)?s.workouts:[];s.nutrition=s.nutrition||{};s.habits=Array.isArray(s.habits)?s.habits:b.habits;s.todos=Array.isArray(s.todos)?s.todos:[];s.weather=s.weather||{};s.goals=Object.assign(b.goals,s.goals||{});s.workouts.forEach(w=>{w.id=w.id||id();w.date=w.date||today();w.title=w.title||w.name||'Workout'});s.todos.forEach(t=>{t.id=t.id||id();t.title=t.title||'';t.due=t.due||'';t.notes=t.notes||'';t.done=!!t.done;t.created=t.created||today()});return s}let state=norm(load());function save(skip){localStorage.setItem(KEY,JSON.stringify(state));if(!skip)render()}function workoutsOn(d){return state.workouts.filter(w=>w.date===d)}function gymDone(d){return workoutsOn(d).length>0}function proteinDone(d){let n=state.nutrition[d]||{};return Number(n.protein||0)>=Number(state.goals.protein||0)}function habitsDone(d){return state.habits.length>0&&state.habits.every(h=>h.done&&h.done[d])}function score(d){return[gymDone(d),habitsDone(d),proteinDone(d)]}function weekDates(d){let x=ymd(d),day=x.getDay(),diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return Array.from({length:7},(_,i)=>{let y=new Date(x);y.setDate(x.getDate()+i);return fmt(y)})}function weeklyCount(d){let ds=weekDates(d);return state.workouts.filter(w=>ds.includes(w.date)).length}function greeting(){let h=new Date().getHours();return h<12?'Morning Yasmin':h<18?'Afternoon Yasmin':'Evening Yasmin'}function updateHeader(){let n=score(today()).filter(Boolean).length,w=state.weather||{};$('#headSub').textContent=`${greeting()} · ${n}/3 goals complete`;$('#headScore').textContent=`${n}/3`;$('#headScore').classList.toggle('done',n===3);$('#headWeather').textContent=w.temp!==undefined&&!w.error?`${Math.round(w.temp)}°C · ${w.text||'Weather'}`:'Weather'}function setTab(t){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$$('.section').forEach(s=>s.classList.toggle('active',s.id===t));render()}function wText(c){c=Number(c);if(c===0)return'Clear';if([1,2,3].includes(c))return'Cloudy';if([45,48].includes(c))return'Foggy';if([51,53,55,56,57].includes(c))return'Drizzle';if([61,63,65,66,67,80,81,82].includes(c))return'Rain';if([71,73,75,77,85,86].includes(c))return'Snow';if([95,96,99].includes(c))return'Storms';return'Weather'}function wAdvice(w){if(!w||w.error)return'Weather unavailable';if(w.rain>=1||/Rain|Drizzle|Storm/.test(w.text))return'Rain likely — plan indoor or take a coat';if(w.temp>=18&&w.temp<=24&&w.wind<25)return'Good walking weather';if(w.temp<5)return'Cold outside — wrap up';if(w.temp>25)return'Warm outside — hydrate';if(w.wind>=30)return'Windy outside';return w.text+' outside'}function weatherSummary(){let w=state.weather||{};return w.temp!==undefined&&!w.error?`${Math.round(w.temp)}°C · ${wAdvice(w)}`:'Tap weather refresh below for local conditions'}function weatherCard(){let w=state.weather||{};if(w.error)return`<div class='card'><h3>Local weather</h3><p class='muted'>${esc(w.error)}</p><button class='btn full' data-act='weather'>Try again</button></div>`;if(w.temp===undefined)return`<div class='card'><h3>Local weather</h3><p class='muted'>Use your phone location to show weather on the Today tile.</p><button class='btn full' data-act='weather'>Use my location</button></div>`;return`<div class='card'><h3>Local weather</h3><div class='row'><div><div class='weatherbig'>${Math.round(w.temp)}°C</div><p class='muted'>${esc(wAdvice(w))}</p></div><button class='btn secondary small' data-act='weather'>Refresh</button></div><span class='chip'>Feels ${Math.round(w.feels)}°C</span><span class='chip'>${esc(w.text)}</span><span class='chip'>Rain ${w.rain} mm</span><span class='chip'>Wind ${Math.round(w.wind)} km/h</span><p class='muted small'>Updated ${esc(w.updated||'recently')}</p></div>`}function nutritionForm(d,p){let n=state.nutrition[d]||{};return`<label>Calories</label><input id='${p}_cal' type='number' value='${n.calories||''}' placeholder='${state.goals.calories}'><label>Protein grams</label><input id='${p}_pro' type='number' value='${n.protein||''}' placeholder='${state.goals.protein}'><button class='btn full' data-act='saveNutrition' data-date='${d}' data-prefix='${p}'>Save nutrition</button>`}function habitChecklist(d,p){if(!state.habits.length)return`<p class='muted'>No habits yet.</p>`;return`<div class='list'>`+state.habits.map(h=>`<label class='item row'><span>${esc(h.name)}</span><input id='${p}_habit_${h.id}' style='width:auto;min-height:auto' type='checkbox' ${h.done&&h.done[d]?'checked':''}></label>`).join('')+`</div><button class='btn full' data-act='saveHabits' data-date='${d}' data-prefix='${p}'>Save habits</button>`}function italyLine(){let target=new Date(2026,7,19,6,0,0),now=new Date(),day=86400000,diff=target-now;if(diff>=0){return Math.ceil(diff/day)+' days until Italy 🍕'}return 'Italy was '+Math.floor(Math.abs(diff)/day)+' days ago'}function dashboard(){let d=today(),s=score(d),done=s.filter(Boolean).length,w=weeklyCount(d),goal=Number(state.goals.weeklyWorkouts||3),todos=state.todos.filter(t=>!t.done).sort(todoSort).slice(0,3);$('#dashboard').innerHTML=`<div class='card hero'><h2>Today</h2><p class='muted'>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><p class='muted'>${done} / 3 daily goals complete</p><p class='muted'>${esc(weatherSummary())}</p><p class='muted'>${esc(italyLine())}</p></div><div class='grid'><div class='card metric ${s[0]?'done':'miss'}'><span>Gym</span><b>${s[0]?'Done':'Missing'}</b><span>${workoutsOn(d).length||'No'} workout today</span></div><div class='card metric ${s[1]?'done':'miss'}'><span>Habits</span><b>${s[1]?'Done':'Missing'}</b><span>Daily habit list</span></div><div class='card metric ${s[2]?'done':'miss'}'><span>Protein</span><b>${s[2]?'Done':'Missing'}</b><span>${state.goals.protein}g target</span></div></div><div class='card'><h2>This week</h2><p><b>${w} / ${goal}</b> workouts completed Monday to Sunday.</p></div><div class='card'><h3>Upcoming to-dos</h3>${todos.length?'<div class=list>'+todos.map(todoItem).join('')+'</div>':'<p class=muted>No active to-dos.</p>'}</div><div class='two'><div class='card'><h3>Quick nutrition today</h3>${nutritionForm(d,'dash')}</div><div class='card'><h3>Today habits</h3>${habitChecklist(d,'dash')}</div></div><div class='card'><h3>Settings</h3><div class='row'><div><label>Protein goal</label><input id='goalProtein' type='number' value='${state.goals.protein}'></div><div><label>Calories goal</label><input id='goalCalories' type='number' value='${state.goals.calories}'></div></div><label>Weekly workout goal</label><input id='goalWeekly' type='number' value='${state.goals.weeklyWorkouts}'><button class='btn full' data-act='goals'>Save goals</button></div>${weatherCard()}`}function gym(){let ws=state.workouts.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,20);$('#gym').innerHTML=`<div class='card hero'><h2>Gym</h2><p class='muted'>Simple workout logging: date, workout name, save.</p><label>Date</label><input id='simpleWorkoutDate' type='date' value='${today()}'><label>Workout name</label><input id='simpleWorkoutName' placeholder='Push day, Pull day, Legs, Cardio...'><button class='btn full' data-act='addWorkout'>Save workout</button></div><div class='card'><h3>Saved workouts</h3>${ws.length?'<div class=list>'+ws.map(w=>`<div class='item row'><div><b>${esc(w.title||'Workout')}</b><br><span class='muted'>${esc(w.date)}</span></div><button class='btn danger small' data-act='deleteWorkout' data-id='${w.id}'>Delete</button></div>`).join('')+'</div>':'<p class=muted>No workouts saved yet.</p>'}</div>`}function nutrition(){let d=ui.nutritionDate||today(),out=[];for(let i=13;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);let k=fmt(x),n=state.nutrition[k]||{};out.push(`<div class='item row'><span>${k}</span><span style='text-align:right'>${n.calories||0} cal / ${n.protein||0}g</span></div>`)}$('#nutrition').innerHTML=`<div class='card'><h2>Calories and protein</h2><label>Date</label><input id='nutritionDate' type='date' value='${d}'>${nutritionForm(d,'nutrition')}</div><div class='card'><h3>Last 14 days</h3><div class='list'>${out.join('')}</div></div>`}function habits(){let d=ui.habitDate||today();$('#habits').innerHTML=`<div class='card'><h2>Habits</h2><label>Date</label><input id='habitDate' type='date' value='${d}'>${habitChecklist(d,'habits')}</div><div class='card'><h3>Add habit</h3><div class='row'><input id='newHabit' placeholder='Habit name'><button class='btn' data-act='addHabit'>Add</button></div></div><div class='card'><h3>Manage habits</h3>${state.habits.map(h=>`<div class='item row'><span>${esc(h.name)}</span><button class='btn danger small' data-act='deleteHabit' data-id='${h.id}'>Delete</button></div>`).join('')||'<p class=muted>No habits.</p>'}</div>`}function todoSort(a,b){let ad=a.due||'9999-12-31',bd=b.due||'9999-12-31';if(a.done!==b.done)return a.done?1:-1;if(ad!==bd)return ad.localeCompare(bd);return String(a.created||'').localeCompare(String(b.created||''))}function due(t){if(t.done)return['Done','due-done'];if(!t.due)return['No deadline','due-soon'];let diff=Math.round((ymd(t.due)-ymd(today()))/86400000);if(diff<0)return[`Overdue by ${Math.abs(diff)}d`,'due-overdue'];if(diff===0)return['Due today','due-today'];if(diff===1)return['Due tomorrow','due-soon'];return[`Due in ${diff}d`,'due-soon']}function todoItem(t){let d=due(t);return`<div class='item todo ${t.done?'done':''}'><div class='todo-title'>${esc(t.title)}</div>${t.notes?`<div class='todo-notes'>${esc(t.notes)}</div>`:''}<span class='chip'>${d[0]}</span>${t.due?`<span class='chip'>${t.due}</span>`:''}<div class='todo-actions'><button class='btn ${t.done?'secondary':'good'}' data-act='toggleTodo' data-id='${t.id}'>${t.done?'Mark active':'Mark done'}</button><button class='btn danger' data-act='deleteTodo' data-id='${t.id}'>Delete</button></div></div>`}function todo(){let list=state.todos.slice().sort(todoSort);$('#todo').innerHTML=`<div class='card hero'><h2>To-do list</h2><p class='muted'>Closest deadlines stay at the top.</p></div><div class='card'><h3>Add task</h3><label>Task</label><input id='todoTitle' placeholder='What needs doing?'><label>Deadline</label><input id='todoDue' type='date'><label>Notes optional</label><textarea id='todoNotes' rows='3'></textarea><button class='btn full' data-act='addTodo'>Add to-do</button></div><div class='card'><h3>Closest deadlines</h3>${list.length?'<div class=list>'+list.map(todoItem).join('')+'</div>':'<p class=muted>No to-dos yet.</p>'}</div>`}function calendar(){let base=$('#monthPick')?.value||monthKey(new Date()),p=base.split('-').map(Number),first=new Date(p[0],p[1]-1,1,12),start=new Date(first),off=(first.getDay()+6)%7;start.setDate(first.getDate()-off);let cells=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=fmt(d),s=score(k),all=s.every(Boolean);cells.push(`<div class='day ${d.getMonth()!==first.getMonth()?'out':''} ${k===today()?'today':''} ${all?'allgreen':''}'><div class='num'>${d.getDate()}</div><div class='marks'><span class='mark ${s[0]?'ok':'no'}'>${IC.gym}</span><span class='mark ${s[1]?'ok':'no'}'>${IC.habits}</span><span class='mark ${s[2]?'ok':'no'}'>${IC.protein}</span></div></div>`)}$('#calendar').innerHTML=`<div class='card'><div class='calendar-top'><h2>Calendar</h2><div class='month-control'><label>Month</label><input id='monthPick' type='month' value='${base}'></div></div><div class='calendar'><div class='weekday'>Mon</div><div class='weekday'>Tue</div><div class='weekday'>Wed</div><div class='weekday'>Thu</div><div class='weekday'>Fri</div><div class='weekday'>Sat</div><div class='weekday'>Sun</div>${cells.join('')}</div><p class='muted small'>Gym · Habits · Protein</p></div>`}function render(){dashboard();gym();nutrition();habits();todo();calendar();updateHeader();syncHeaderScroll()}function locate(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej(new Error('Location is not available.'));navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>rej(new Error(e.message||'Location permission denied.')),{enableHighAccuracy:false,timeout:12000,maximumAge:900000})})}async function refreshWeather(){if(ui.weatherBusy)return;ui.weatherBusy=true;dashboard();try{let c=await locate(),r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=auto`);if(!r.ok)throw new Error('Weather service could not be reached.');let x=(await r.json()).current||{};state.weather={temp:Number(x.temperature_2m),feels:Number(x.apparent_temperature),rain:Number(x.precipitation||0),wind:Number(x.wind_speed_10m||0),text:wText(x.weather_code),updated:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};save()}catch(e){state.weather={error:e.message||'Weather failed.'};save()}finally{ui.weatherBusy=false;dashboard()}}function syncHeaderScroll(){let bar=$('#topbar'),y=scrollY||0;if(!ui.headerSmall&&y>44){ui.headerSmall=true;bar.classList.add('shrink')}else if(ui.headerSmall&&y<10){ui.headerSmall=false;bar.classList.remove('shrink')}}function act(a,b){let d=b.dataset;if(a==='weather')return refreshWeather();if(a==='goals'){state.goals.protein=Number($('#goalProtein').value||0);state.goals.calories=Number($('#goalCalories').value||0);state.goals.weeklyWorkouts=Number($('#goalWeekly').value||0);return save()}if(a==='addWorkout'){let date=$('#simpleWorkoutDate').value||today(),title=$('#simpleWorkoutName').value.trim();if(!title)return alert('Enter a workout name.');state.workouts.push({id:id(),date,title,exercises:[]});return save()}if(a==='deleteWorkout'){state.workouts=state.workouts.filter(w=>w.id!==d.id);return save()}if(a==='saveNutrition'){state.nutrition[d.date]={calories:Number($('#'+d.prefix+'_cal')?.value||0),protein:Number($('#'+d.prefix+'_pro')?.value||0)};return save()}if(a==='saveHabits'){state.habits.forEach(h=>{h.done=h.done||{};h.done[d.date]=!!$('#'+d.prefix+'_habit_'+h.id)?.checked});return save()}if(a==='addHabit'){let v=$('#newHabit').value.trim();if(v){state.habits.push({id:id(),name:v,done:{}});return save()}}if(a==='deleteHabit'){state.habits=state.habits.filter(h=>h.id!==d.id);return save()}if(a==='addTodo'){let title=$('#todoTitle').value.trim();if(!title)return alert('Enter a to-do.');state.todos.push({id:id(),title,due:$('#todoDue').value||'',notes:$('#todoNotes').value.trim(),done:false,created:today()});return save()}if(a==='toggleTodo'){let t=state.todos.find(x=>x.id===d.id);if(t){t.done=!t.done;return save()}}if(a==='deleteTodo'&&confirm('Delete this to-do?')){state.todos=state.todos.filter(t=>t.id!==d.id);return save()}}document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b)});document.addEventListener('change',e=>{if(e.target.id==='nutritionDate'){ui.nutritionDate=e.target.value||today();nutrition()}if(e.target.id==='habitDate'){ui.habitDate=e.target.value||today();habits()}if(e.target.id==='monthPick')calendar()});$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));addEventListener('scroll',syncHeaderScroll,{passive:true});save(true);render();})();</script></body></html>
