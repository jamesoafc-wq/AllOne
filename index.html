<script>
(function(){
'use strict';
const KEY='all_in_one_fit_one_file_v1';
const EX=['Bench Press','Incline Bench Press','Dumbbell Bench Press','Chest Press Machine','Cable Fly','Pec Deck','Push Up','Shoulder Press','Dumbbell Shoulder Press','Arnold Press','Lateral Raise','Rear Delt Fly','Face Pull','Pull Up','Chin Up','Lat Pulldown','Seated Cable Row','Barbell Row','Dumbbell Row','Deadlift','Romanian Deadlift','Squat','Front Squat','Leg Press','Hack Squat','Lunge','Bulgarian Split Squat','Leg Extension','Leg Curl','Calf Raise','Hip Thrust','Bicep Curl','Hammer Curl','Preacher Curl','Tricep Pushdown','Overhead Tricep Extension','Skull Crusher','Dip','Plank','Side Plank','Crunch','Cable Crunch','Hanging Leg Raise','Russian Twist','Treadmill Run','Bike','Rowing Machine','Stairmaster','Elliptical','Kettlebell Swing','Farmer Carry','Goblet Squat','Box Jump','Hip Abduction','Hip Adduction','Smith Machine Squat','Smith Machine Bench Press'];
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
let ui={tab:'dashboard',progressExercise:'Bench Press',recentExercise:'Bench Press',nutritionDate:today(),habitDate:today(),weatherBusy:false};
function pad(n){return String(n).padStart(2,'0')} function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())} function today(){return fmt(new Date())} function ymd(s){let a=String(s||today()).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1,12)} function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)} function id(){return Math.random().toString(36).slice(2,10)} function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll(String.fromCharCode(39),'&#39;').replaceAll(String.fromCharCode(34),'&quot;')}
function blank(){return {exercises:EX.slice(),workouts:[],nutrition:{},habits:[{id:id(),name:'Steps or walk',done:{}},{id:id(),name:'Drink water',done:{}},{id:id(),name:'Sleep routine',done:{}}],todos:[],weather:{},goals:{protein:160,calories:2400,weeklyWorkouts:3},draftWorkout:{date:today(),title:'',exercises:[]}}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function norm(raw){let b=blank(),s=Object.assign(b,raw||{});s.exercises=Array.isArray(s.exercises)?Array.from(new Set(s.exercises.concat(EX))).sort():EX.slice();s.workouts=Array.isArray(s.workouts)?s.workouts:[];s.nutrition=s.nutrition||{};s.habits=Array.isArray(s.habits)?s.habits:b.habits;s.todos=Array.isArray(s.todos)?s.todos:[];s.weather=s.weather||{};s.goals=Object.assign(b.goals,s.goals||{});if(!s.draftWorkout||!Array.isArray(s.draftWorkout.exercises))s.draftWorkout={date:today(),title:'',exercises:[]};s.workouts.forEach(w=>{w.id=w.id||id();w.exercises=Array.isArray(w.exercises)?w.exercises:[];w.exercises.forEach(e=>{e.id=e.id||id();e.sets=Array.isArray(e.sets)?e.sets:[]})});s.draftWorkout.exercises.forEach(e=>{e.id=e.id||id();e.sets=Array.isArray(e.sets)?e.sets:[]});s.todos.forEach(t=>{t.id=t.id||id();t.title=t.title||'';t.due=t.due||'';t.notes=t.notes||'';t.done=!!t.done;t.created=t.created||today()});return s}
let state=norm(load()); function save(skip){localStorage.setItem(KEY,JSON.stringify(state));if(!skip)render()}
function markIcon(k){return {gym:`<svg viewBox='0 0 24 24'><path d='M3 10v4M6 8v8M9 9v6M15 9v6M18 8v8M21 10v4M6 12h12'></path></svg>`,habits:`<svg viewBox='0 0 24 24'><path d='M7 7a7 7 0 0 1 10.5 1'></path><path d='M18 4v4h-4'></path><path d='M17 17a7 7 0 0 1-10.5-1'></path><path d='M6 20v-4h4'></path></svg>`,protein:`<svg viewBox='0 0 24 24'><path d='M8.5 6.5c1.8-1.5 4.8-2 7.1-.9 3.2 1.6 4.2 5.5 2.3 8.3-1.9 2.8-5.8 4.1-9.2 3.2C5.4 16.3 4 13.1 4.8 10.2c.4-1.4 1.5-2.7 3.7-3.7z'></path><circle cx='15.8' cy='10' r='1.8'></circle></svg>`}[k]}
function weekStart(d){let x=ymd(d),day=x.getDay(),diff=day===0?-6:1-day;x.setDate(x.getDate()+diff);return fmt(x)} function weekDates(d){let s=ymd(weekStart(d));return Array.from({length:7},(_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return fmt(x)})} function workoutsOn(d){return state.workouts.filter(w=>w.date===d)} function gymDone(d){return workoutsOn(d).length>0} function proteinDone(d){let n=state.nutrition[d]||{};return Number(n.protein||0)>=Number(state.goals.protein||0)} function habitsDone(d){return state.habits.length>0&&state.habits.every(h=>h.done&&h.done[d])} function dailyScore(d){return [gymDone(d),habitsDone(d),proteinDone(d)]} function weeklyWorkoutCount(d){let ds=weekDates(d);return state.workouts.filter(w=>ds.includes(w.date)).length}
function setTab(t){ui.tab=t;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$$('.section').forEach(s=>s.classList.toggle('active',s.id===t));render()}
function weatherCodeText(c){c=Number(c);if(c===0)return 'Clear';if([1,2,3].includes(c))return 'Cloudy';if([45,48].includes(c))return 'Foggy';if([51,53,55,56,57].includes(c))return 'Drizzle';if([61,63,65,66,67,80,81,82].includes(c))return 'Rain';if([71,73,75,77,85,86].includes(c))return 'Snow';if([95,96,99].includes(c))return 'Storms';return 'Weather'}
function weatherAdvice(w){if(!w||w.error)return 'Weather unavailable';if(w.rain>=1||/Rain|Drizzle|Storm/.test(w.text))return 'Rain likely — plan indoor or take a coat';if(w.temp>=18&&w.temp<=24&&w.wind<25)return 'Good walking weather';if(w.temp<5)return 'Cold outside — wrap up';if(w.temp>25)return 'Warm outside — hydrate';if(w.wind>=30)return 'Windy outside';return w.text+' outside'}
function weatherSummary(){let w=state.weather||{};if(w.temp!==undefined&&!w.error)return `${Math.round(w.temp)}°C · ${weatherAdvice(w)}`;return 'Tap weather refresh below for local conditions'}
function weatherCard(){let w=state.weather||{};if(w.error)return `<div class='card'><h3>Local weather</h3><p class='muted'>${esc(w.error)}</p><button class='btn full' onclick='app.refreshWeather()'>Try again</button></div>`;if(w.temp===undefined)return `<div class='card'><h3>Local weather</h3><p class='muted'>Use your phone location to show a small weather summary on the Today tile.</p><button class='btn full' onclick='app.refreshWeather()'>Use my location</button></div>`;return `<div class='card'><h3>Local weather</h3><div class='row'><div><div class='weatherbig'>${Math.round(w.temp)}°C</div><p class='muted'>${esc(weatherAdvice(w))}</p></div><button class='btn secondary small' onclick='app.refreshWeather()'>Refresh</button></div><div class='weatherrow'><span class='weatherchip'>Feels ${Math.round(w.feels)}°C</span><span class='weatherchip'>${esc(w.text)}</span><span class='weatherchip'>Rain ${w.rain} mm</span><span class='weatherchip'>Wind ${Math.round(w.wind)} km/h</span></div><p class='muted small'>Updated ${esc(w.updated||'recently')}</p></div>`}
function options(sel){return state.exercises.map(e=>`<option value='${esc(e)}' ${e===sel?'selected':''}>${esc(e)}</option>`).join('')} function nutritionForm(d,p){let n=state.nutrition[d]||{};return `<label>Calories</label><input id='${p}_cal' type='number' value='${n.calories||''}' placeholder='${state.goals.calories}'><label>Protein grams</label><input id='${p}_pro' type='number' value='${n.protein||''}' placeholder='${state.goals.protein}'><button class='btn full' onclick='app.saveNutrition('${d}','${p}')'>Save nutrition</button>`} function habitChecklist(d,p){if(!state.habits.length)return `<p class='muted'>No habits yet.</p>`;return `<div class='list'>`+state.habits.map(h=>`<label class='item row'><span>${esc(h.name)}</span><input id='${p}_habit_${h.id}' style='width:auto;min-height:auto' type='checkbox' ${h.done&&h.done[d]?'checked':''}></label>`).join('')+`</div><button class='btn full' onclick='app.saveHabitsForDate('${d}','${p}')'>Save habits</button>`}
function renderDashboard(){let d=today(),sc=dailyScore(d),done=sc.filter(Boolean).length,w=weeklyWorkoutCount(d),goal=Number(state.goals.weeklyWorkouts||3),todos=state.todos.filter(t=>!t.done).sort(todoSort).slice(0,3);$('#dashboard').innerHTML=`<div class='card hero'><h2>Today</h2><p class='muted'>${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><p class='muted'>${done} / 3 daily goals complete</p><p class='muted'>${esc(weatherSummary())}</p></div><div class='grid'><div class='card metric ${sc[0]?'done':'miss'}'><span>Gym</span><div class='status'><b>${sc[0]?'Done':'Missing'}</b>${sc[0]?'<div class=bigcheck>✓</div>':''}</div><span>${workoutsOn(d).length||'No'} workout today</span></div><div class='card metric ${sc[1]?'done':'miss'}'><span>Habits</span><div class='status'><b>${sc[1]?'Done':'Missing'}</b>${sc[1]?'<div class=bigcheck>✓</div>':''}</div><span>Daily habit list</span></div><div class='card metric ${sc[2]?'done':'miss'}'><span>Protein</span><div class='status'><b>${sc[2]?'Done':'Missing'}</b>${sc[2]?'<div class=bigcheck>✓</div>':''}</div><span>${state.goals.protein}g target</span></div></div><div class='card'><h2>This week</h2><p><b>${w} / ${goal}</b> workouts completed Monday to Sunday.</p></div><div class='card'><h3>Upcoming to-dos</h3>${todos.length?'<div class=list>'+todos.map(todoItem).join('')+'</div>':'<p class=muted>No active to-dos.</p>'}</div><div class='two'><div class='card'><h3>Quick nutrition today</h3>${nutritionForm(d,'dash')}</div><div class='card'><h3>Today habits</h3>${habitChecklist(d,'dash')}</div></div><div class='card'><h3>Settings</h3><div class='row'><div><label>Protein goal</label><input id='goalProtein' type='number' value='${state.goals.protein}'></div><div><label>Calories goal</label><input id='goalCalories' type='number' value='${state.goals.calories}'></div></div><label>Weekly workout goal</label><input id='goalWeekly' type='number' value='${state.goals.weeklyWorkouts}'><button class='btn full' onclick='app.saveGoals()'>Save goals</button></div>${weatherCard()}`}
function draftHtml(){let l=state.draftWorkout.exercises||[];if(!l.length)return `<p class='muted'>No exercises added yet.</p>`;return `<div class='list'>`+l.map((e,i)=>`<div class='exercise'><div class='row'><div><b>${esc(e.name)}</b><br><span class='muted'>${e.sets.length} set${e.sets.length===1?'':'s'}</span></div><button class='btn danger small' onclick='app.removeExerciseFromDraft(${i})'>Remove</button></div><div class='prev'>Last time: ${previousSetsText(e.name)}</div><div class='setline'><div><label>Weight kg</label><input id='w_${e.id}' type='number' step='0.5'></div><div><label>Reps</label><input id='r_${e.id}' type='number'></div><button class='btn' onclick='app.addSetToExercise('${e.id}')'>Add set</button></div><div>${e.sets.map((s,j)=>`<span class='chip'>${s.weight} kg x ${s.reps}<button onclick='app.removeSetFromExercise('${e.id}',${j})'>x</button></span>`).join('')||`<p class='muted small'>No sets yet.</p>`}</div></div>`).join('')+`</div>`}
function renderGym(){let d=state.draftWorkout;if(!d.date)d.date=today();let sel=ui.recentExercise||state.exercises[0];$('#gym').innerHTML=`<div class='card hero'><h2>Build workout</h2><p class='muted'>Add exercises and sets, then save the workout.</p><label>Date</label><input id='workoutDate' type='date' value='${d.date}' onchange='app.setDraftDate(this.value)'><label>Workout name optional</label><input id='workoutTitle' value='${esc(d.title||'')}' placeholder='Push day, Pull day, Legs...' oninput='app.setDraftTitle(this.value)'><div class='divider'></div><label>Add exercise</label><div class='row'><select id='exerciseSelect' onchange='app.pickExercise(this.value)'>${options(sel)}</select><button class='btn' onclick='app.addExerciseToWorkout()'>Add</button></div></div><div class='card'><h3>Current workout</h3>${draftHtml()}<button class='btn full' onclick='app.saveWorkout()'>Save full workout</button><button class='btn secondary full' onclick='app.clearDraft()'>Clear draft</button></div><div class='card'><h3>Previous sets for ${esc(sel)}</h3>${previousSets(sel)}</div><div class='card'><h3>Add custom exercise</h3><div class='row'><input id='newExercise' placeholder='Exercise name'><button class='btn' onclick='app.addCustomExercise()'>Add</button></div></div><div class='card'><h3>Recent workouts</h3>${recentWorkouts()}</div>`}
function previousSets(name){let m=[];state.workouts.slice().reverse().forEach(w=>(w.exercises||[]).forEach(e=>{if(e.name===name&&m.length<6)m.push({date:w.date,sets:e.sets||[]})}));if(!m.length)return `<p class='muted'>No previous sets yet.</p>`;return `<div class='list'>`+m.map(x=>`<div class='item'><b>${x.date}</b><br><span class='muted'>${x.sets.map(s=>`${s.weight} kg x ${s.reps}`).join(', ')}</span></div>`).join('')+`</div>`} function previousSetsText(name){let latest=null;state.workouts.slice().reverse().some(w=>(w.exercises||[]).some(e=>{if(e.name===name){latest={date:w.date,sets:e.sets||[]};return true}return false}));return latest?`${latest.date}: ${latest.sets.map(s=>`${s.weight} x ${s.reps}`).join(', ')}`:'no history yet'} function recentWorkouts(){let ws=state.workouts.slice().reverse().slice(0,8);if(!ws.length)return `<p class='muted'>No workouts logged yet.</p>`;return `<div class='list'>`+ws.map(w=>`<div class='item'><div class='row'><div><b>${w.date}${w.title?' · '+esc(w.title):''}</b><br><span class='muted'>${(w.exercises||[]).map(e=>esc(e.name)).join(', ')}</span></div><button class='btn danger small' onclick='app.deleteWorkout('${w.id}')'>Delete</button></div></div>`).join('')+`</div>`}
function renderNutrition(){let d=ui.nutritionDate||today();let out=[];for(let i=13;i>=0;i--){let x=new Date();x.setDate(x.getDate()-i);let k=fmt(x),n=state.nutrition[k]||{};out.push(`<div class='item row'><span>${k}</span><span style='text-align:right'>${n.calories||0} cal / ${n.protein||0}g</span></div>`)}$('#nutrition').innerHTML=`<div class='card'><h2>Calories and protein</h2><label>Date</label><input type='date' value='${d}' onchange='app.setNutritionDate(this.value)'>${nutritionForm(d,'nutrition')}</div><div class='card'><h3>Last 14 days</h3><div class='list'>${out.join('')}</div></div>`}
function renderHabits(){let d=ui.habitDate||today();$('#habits').innerHTML=`<div class='card'><h2>Habits</h2><label>Date</label><input type='date' value='${d}' onchange='app.setHabitDate(this.value)'>${habitChecklist(d,'habits')}</div><div class='card'><h3>Add habit</h3><div class='row'><input id='newHabit' placeholder='Habit name'><button class='btn' onclick='app.addHabit()'>Add</button></div></div><div class='card'><h3>Manage habits</h3>${state.habits.map(h=>`<div class='item row'><span>${esc(h.name)}</span><button class='btn danger small' onclick='app.deleteHabit('${h.id}')'>Delete</button></div>`).join('')||'<p class=muted>No habits.</p>'}</div>`}
function todoSort(a,b){let ad=a.due||'9999-12-31',bd=b.due||'9999-12-31';if(a.done!==b.done)return a.done?1:-1;if(ad!==bd)return ad.localeCompare(bd);return String(a.created||'').localeCompare(String(b.created||''))} function dueInfo(due,done){if(done)return {text:'Done',cls:'due-done'};if(!due)return {text:'No deadline',cls:'due-soon'};let diff=Math.round((ymd(due)-ymd(today()))/86400000);if(diff<0)return {text:`Overdue by ${Math.abs(diff)}d`,cls:'due-overdue'};if(diff===0)return {text:'Due today',cls:'due-today'};if(diff===1)return {text:'Due tomorrow',cls:'due-soon'};return {text:`Due in ${diff}d`,cls:diff<=7?'due-soon':''}} function todoItem(t){let d=dueInfo(t.due,t.done);return `<div class='item todo ${t.done?'done':''}'><div class='todo-title'>${esc(t.title)}</div>${t.notes?`<div class='todo-notes'>${esc(t.notes)}</div>`:''}<div class='todo-meta'><span class='duechip ${d.cls}'>${d.text}</span>${t.due?`<span class='duechip'>${t.due}</span>`:''}</div><div class='todo-actions'><button class='btn ${t.done?'secondary':'good'}' onclick='app.toggleTodo('${t.id}')'>${t.done?'Mark active':'Mark done'}</button><button class='btn danger' onclick='app.deleteTodo('${t.id}')'>Delete</button></div></div>`}
function renderTodo(){let list=state.todos.slice().sort(todoSort);$('#todo').innerHTML=`<div class='card hero'><h2>To-do list</h2><p class='muted'>Standalone task list. Closest deadlines stay at the top.</p></div><div class='card'><h3>Add task</h3><label>Task</label><input id='todoTitle' placeholder='What needs doing?'><label>Deadline</label><input id='todoDue' type='date'><label>Notes optional</label><textarea id='todoNotes' rows='3' placeholder='Extra details...'></textarea><button class='btn full' onclick='app.addTodo()'>Add to-do</button></div><div class='card'><h3>Closest deadlines</h3>${list.length?'<div class=list>'+list.map(todoItem).join('')+'</div>':'<p class=muted>No to-dos yet.</p>'}</div>`}
function renderCalendar(){let base=$('#monthPick')?.value||monthKey(new Date()),p=base.split('-').map(Number),first=new Date(p[0],p[1]-1,1,12),start=new Date(first),off=(first.getDay()+6)%7;start.setDate(first.getDate()-off);let cells=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let k=fmt(d),s=dailyScore(k),all=s.every(Boolean);cells.push(`<div class='day ${d.getMonth()!==first.getMonth()?'out':''} ${k===today()?'today':''} ${all?'allgreen':''}'><div class='num'>${d.getDate()}</div><div class='marks'><span class='mark ${s[0]?'ok':'no'}'>${markIcon('gym')}</span><span class='mark ${s[1]?'ok':'no'}'>${markIcon('habits')}</span><span class='mark ${s[2]?'ok':'no'}'>${markIcon('protein')}</span></div></div>`)}$('#calendar').innerHTML=`<div class='card'><div class='calendar-top'><h2>Calendar</h2><div class='month-control'><label>Month</label><input id='monthPick' type='month' value='${base}' onchange='app.render()'></div></div><div class='calendar'><div class='weekday'>Mon</div><div class='weekday'>Tue</div><div class='weekday'>Wed</div><div class='weekday'>Thu</div><div class='weekday'>Fri</div><div class='weekday'>Sat</div><div class='weekday'>Sun</div>${cells.join('')}</div><p class='muted small'>Gym · Habits · Protein</p></div>`}
function progressPoints(ex){let pts=[];state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(e.name===ex){let best=0;(e.sets||[]).forEach(s=>{let v=Number(s.weight)*(1+Number(s.reps)/30);if(v>best)best=v});if(best)pts.push({date:w.date,value:Math.round(best)})}}));return pts} function renderProgress(){let sel=$('#progressExercise')?.value||ui.progressExercise||state.exercises[0];ui.progressExercise=sel;let pts=progressPoints(sel),max=Math.max(1,...pts.map(p=>p.value));let bars=pts.slice(-12).map(p=>`<div class='bar' style='height:${Math.max(8,(p.value/max)*120)}px'><i>${p.value}</i><span>${p.date.slice(5)}</span></div>`).join('')||'<p class=muted>No data yet.</p>';$('#progress').innerHTML=`<div class='card'><h2>Progress</h2><label>Exercise</label><select id='progressExercise' onchange='app.setProgressExercise(this.value)'>${options(sel)}</select><p class='muted'>Best estimated one rep max per workout.</p><div class='barbox'>${bars}</div></div><div class='card'><h3>Backup</h3><button class='btn full' onclick='app.exportData()'>Export JSON backup</button><label>Import JSON backup</label><textarea id='importBox' rows='5' placeholder='Paste backup here'></textarea><button class='btn secondary full' onclick='app.importData()'>Import backup</button></div>`}
function render(){renderDashboard();renderGym();renderNutrition();renderHabits();renderTodo();renderCalendar();renderProgress()}
function locate(){return new Promise((resolve,reject)=>{if(!navigator.geolocation)return reject(new Error('Location is not available in this browser.'));navigator.geolocation.getCurrentPosition(p=>resolve(p.coords),e=>reject(new Error(e.message||'Location permission was denied.')),{enableHighAccuracy:false,timeout:12000,maximumAge:900000})})}
window.app={render,setTab,setNutritionDate(v){ui.nutritionDate=v||today();renderNutrition()},setHabitDate(v){ui.habitDate=v||today();renderHabits()},pickExercise(v){ui.recentExercise=v;renderGym()},setProgressExercise(v){ui.progressExercise=v;renderProgress()},async refreshWeather(){if(ui.weatherBusy)return;ui.weatherBusy=true;renderDashboard();try{let c=await locate(),url=`https://api.open-meteo.com/v1/forecast?latitude=${c.latitude}&longitude=${c.longitude}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&timezone=auto`;let r=await fetch(url);if(!r.ok)throw new Error('Weather service could not be reached.');let j=await r.json(),x=j.current||{};state.weather={temp:Number(x.temperature_2m),feels:Number(x.apparent_temperature),rain:Number(x.precipitation||0),wind:Number(x.wind_speed_10m||0),code:x.weather_code,text:weatherCodeText(x.weather_code),updated:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),lat:c.latitude,lon:c.longitude};save()}catch(e){state.weather={error:e.message||'Weather failed.'};save()}finally{ui.weatherBusy=false;renderDashboard()}},setDraftDate(v){state.draftWorkout.date=v||today();save(true)},setDraftTitle(v){state.draftWorkout.title=v;save(true)},addExerciseToWorkout(){let ex=$('#exerciseSelect').value;ui.recentExercise=ex;if(!state.draftWorkout.exercises.some(e=>e.name===ex))state.draftWorkout.exercises.push({id:id(),name:ex,sets:[]});save()},removeExerciseFromDraft(i){state.draftWorkout.exercises.splice(i,1);save()},addSetToExercise(eid){let e=state.draftWorkout.exercises.find(x=>x.id===eid);if(!e)return;let w=Number($('#w_'+eid).value),r=Number($('#r_'+eid).value);if(!w||!r)return alert('Enter weight and reps.');e.sets.push({weight:w,reps:r});save()},removeSetFromExercise(eid,i){let e=state.draftWorkout.exercises.find(x=>x.id===eid);if(e){e.sets.splice(i,1);save()}},saveWorkout(){let d=state.draftWorkout;if(!d.exercises.length)return alert('Add at least one exercise.');if(d.exercises.some(e=>!e.sets.length))return alert('Every exercise needs at least one set.');state.workouts.push({id:id(),date:d.date||today(),title:(d.title||'').trim(),exercises:d.exercises.map(e=>({id:id(),name:e.name,sets:e.sets.slice()}))});state.draftWorkout={date:d.date||today(),title:'',exercises:[]};save();alert('Workout saved.')},clearDraft(){if(confirm('Clear current workout draft?')){state.draftWorkout={date:today(),title:'',exercises:[]};save()}},deleteWorkout(wid){state.workouts=state.workouts.filter(w=>w.id!==wid);save()},addCustomExercise(){let v=$('#newExercise').value.trim();if(v&&!state.exercises.includes(v)){state.exercises.push(v);state.exercises.sort();ui.recentExercise=v;save()}},saveNutrition(d,p){state.nutrition[d]={calories:Number($('#'+p+'_cal')?.value||0),protein:Number($('#'+p+'_pro')?.value||0)};save()},saveHabitsForDate(d,p){state.habits.forEach(h=>{h.done=h.done||{};h.done[d]=!!$('#'+p+'_habit_'+h.id)?.checked});save()},addHabit(){let v=$('#newHabit').value.trim();if(v){state.habits.push({id:id(),name:v,done:{}});save()}},deleteHabit(hid){state.habits=state.habits.filter(h=>h.id!==hid);save()},saveGoals(){state.goals.protein=Number($('#goalProtein').value||0);state.goals.calories=Number($('#goalCalories').value||0);state.goals.weeklyWorkouts=Number($('#goalWeekly').value||0);save()},addTodo(){let title=$('#todoTitle')?.value.trim()||'';if(!title)return alert('Enter a to-do.');state.todos.push({id:id(),title,due:$('#todoDue')?.value||'',notes:$('#todoNotes')?.value.trim()||'',done:false,created:today()});save()},toggleTodo(tid){let t=state.todos.find(x=>x.id===tid);if(t){t.done=!t.done;save()}},deleteTodo(tid){if(confirm('Delete this to-do?')){state.todos=state.todos.filter(t=>t.id!==tid);save()}},exportData(){let text=JSON.stringify(state,null,2);if(navigator.clipboard)navigator.clipboard.writeText(text);let blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='all-in-one-fit-backup.json';a.click()},importData(){try{state=norm(JSON.parse($('#importBox').value));save();alert('Backup imported.')}catch(e){alert('That JSON backup was not valid.')}}};
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));save(true);render();
})();
