<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12051f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="All In One Fit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>All In One Fit</title>
  <style>
    :root{
      --bg:#090411;
      --bg2:#13071f;
      --panel:rgba(255,255,255,.075);
      --panel2:rgba(255,255,255,.11);
      --line:rgba(255,255,255,.13);
      --line2:rgba(255,255,255,.24);
      --text:#fbf7ff;
      --muted:#bdaed4;
      --soft:#9176b3;
      --purple:#8b5cf6;
      --purple2:#a855f7;
      --pink:#ec4899;
      --cyan:#22d3ee;
      --green:#4ade80;
      --greenGlow:rgba(74,222,128,.72);
      --red:#fb7185;
      --yellow:#facc15;
      --radius:24px;
      --shadow:0 24px 70px rgba(0,0,0,.38);
      color-scheme:dark;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg);min-height:100%}
    body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 18% -6%,rgba(168,85,247,.56),transparent 34%),
        radial-gradient(circle at 95% 6%,rgba(236,72,153,.31),transparent 30%),
        radial-gradient(circle at 60% 90%,rgba(34,211,238,.14),transparent 34%),
        linear-gradient(180deg,#090411 0%,#12051f 42%,#08030f 100%);
      overflow-x:hidden;
      padding-bottom:calc(118px + env(safe-area-inset-bottom));
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:38px 38px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 62%);
    }
    header{
      position:sticky;
      top:0;
      z-index:5;
      padding:calc(26px + env(safe-area-inset-top)) 16px 14px;
      background:linear-gradient(180deg,rgba(9,4,17,.97),rgba(9,4,17,.78));
      border-bottom:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
    }
    .head-inner{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px}
    .logo{
      width:48px;height:48px;border-radius:18px;flex:0 0 auto;
      background:linear-gradient(135deg,var(--purple),var(--pink));
      display:grid;place-items:center;font-weight:1000;letter-spacing:-.08em;
      box-shadow:0 18px 38px rgba(168,85,247,.3), inset 0 1px 0 rgba(255,255,255,.28);
    }
    header h1{margin:0;font-size:27px;line-height:.98;letter-spacing:-.05em;font-weight:1000}
    header p{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.25}
    .wrap{max-width:980px;margin:0 auto;padding:14px 14px 22px;position:relative;z-index:1}
    .section{display:none;animation:rise .18s ease-out}.section.active{display:block}
    @keyframes rise{from{opacity:.6;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    h2{font-size:24px;line-height:1.05;letter-spacing:-.045em;margin:0 0 12px;font-weight:1000}
    h3{font-size:18px;line-height:1.1;letter-spacing:-.03em;margin:0 0 12px;font-weight:950}
    p{line-height:1.45}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.right{text-align:right}
    .card{
      background:linear-gradient(180deg,var(--panel2),var(--panel));
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      margin-bottom:14px;
      box-shadow:0 14px 34px rgba(0,0,0,.2);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    .hero{
      position:relative;overflow:hidden;
      background:
        radial-gradient(circle at 20% 0%,rgba(236,72,153,.3),transparent 35%),
        radial-gradient(circle at 90% 20%,rgba(139,92,246,.38),transparent 34%),
        linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.065));
    }
    .hero:after{content:"";position:absolute;right:-44px;top:-34px;width:142px;height:142px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .two{display:grid;grid-template-columns:1fr;gap:12px}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row.tight>*{flex:0 0 auto}.row.wraprow{flex-wrap:wrap}
    label{display:block;font-size:11px;font-weight:1000;color:#e9ddff;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.08em}
    input,select,textarea{
      width:100%;min-height:48px;padding:13px 13px;border:1px solid var(--line);border-radius:17px;
      background:rgba(255,255,255,.085);color:var(--text);font-size:16px;outline:none;
    }
    input::placeholder,textarea::placeholder{color:#806995} select option{background:#180a27;color:white}
    input:focus,select:focus,textarea:focus{border-color:rgba(168,85,247,.88);box-shadow:0 0 0 4px rgba(168,85,247,.15)}
    .btn{
      min-height:48px;border:0;border-radius:17px;padding:12px 14px;font-size:15px;font-weight:1000;color:white;cursor:pointer;
      background:linear-gradient(135deg,var(--purple),var(--pink));
      box-shadow:0 14px 28px rgba(168,85,247,.22);
    }
    .btn:active{transform:translateY(1px);filter:brightness(.94)}
    .btn.secondary{background:rgba(255,255,255,.105);border:1px solid var(--line);box-shadow:none;color:var(--text)}
    .btn.danger{background:rgba(251,113,133,.14);border:1px solid rgba(251,113,133,.32);box-shadow:none;color:#ffd7df}
    .btn.good{background:rgba(83,240,182,.14);border:1px solid rgba(83,240,182,.28);box-shadow:none;color:#dcfff3}
    .btn.full{width:100%;margin-top:12px}
    .btn.smallbtn{min-height:38px;border-radius:14px;padding:8px 10px;font-size:12px}
    .metric{min-height:114px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
    .metric b{font-size:22px;letter-spacing:-.04em;position:relative}.metric span{font-size:11px;color:var(--muted);font-weight:1000;text-transform:uppercase;letter-spacing:.08em;position:relative}
    .metric:before{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:999px;background:rgba(255,255,255,.08)}
    .metric.done{background:linear-gradient(145deg,rgba(74,222,128,.32),rgba(168,85,247,.11));border-color:rgba(74,222,128,.82);box-shadow:0 0 0 1px rgba(74,222,128,.24),0 0 32px rgba(74,222,128,.35),0 18px 44px rgba(0,0,0,.26);}
    .metric.done b{color:#ecfff4;text-shadow:0 0 18px rgba(74,222,128,.82)}
    .metric.miss{background:linear-gradient(145deg,rgba(251,113,133,.2),rgba(255,255,255,.07));border-color:rgba(251,113,133,.38)}
    .bigcheck{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:23px;font-weight:1000;background:rgba(74,222,128,.22);border:1px solid rgba(74,222,128,.65);box-shadow:0 0 24px rgba(74,222,128,.55);color:#ecfff4}
    .notice{background:rgba(250,204,21,.1);border:1px solid rgba(250,204,21,.24);color:#fff0ad;border-radius:18px;padding:12px;font-size:13px}
    .pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.07);font-size:12px;font-weight:850;color:#eadfff}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:19px;padding:12px}
    .item-title{font-weight:1000}
    .tabs{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
      padding:12px 10px calc(14px + env(safe-area-inset-bottom));
      background:rgba(9,4,17,.86);border-top:1px solid rgba(255,255,255,.13);
      backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
      box-shadow:0 -20px 48px rgba(0,0,0,.4);scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      flex:0 0 94px;min-height:70px;border:1px solid rgba(255,255,255,.11);border-radius:22px;
      background:rgba(255,255,255,.07);color:var(--muted);font-size:12px;font-weight:1000;
      display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;padding:8px 10px;
    }
    .tab span:first-child{font-size:18px;line-height:1}.tab.active{color:white;background:linear-gradient(135deg,rgba(139,92,246,.96),rgba(236,72,153,.86));border-color:rgba(255,255,255,.25);box-shadow:0 14px 28px rgba(168,85,247,.24)}
    .exrow{display:flex;align-items:center;gap:10px}.exrow .excopy{min-width:0;flex:1}.exname{font-weight:1000}.exmeta{color:var(--muted);font-size:12px;margin-top:2px}
    .exicon,.miniicon{display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
    .exicon{width:42px;height:42px;border-radius:16px;flex:0 0 42px}
    .miniicon{width:30px;height:30px;border-radius:12px;flex:0 0 30px}
    .icon-svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .miniicon .icon-svg{width:17px;height:17px;stroke-width:1.9}
    .cat-chest{background:linear-gradient(135deg,#a855f7,#ec4899)}.cat-back{background:linear-gradient(135deg,#6366f1,#22d3ee)}.cat-legs{background:linear-gradient(135deg,#7c3aed,#34d399)}.cat-shoulders{background:linear-gradient(135deg,#8b5cf6,#f59e0b)}.cat-arms{background:linear-gradient(135deg,#ec4899,#fb7185)}.cat-core{background:linear-gradient(135deg,#14b8a6,#8b5cf6)}.cat-cardio{background:linear-gradient(135deg,#06b6d4,#3b82f6)}.cat-full{background:linear-gradient(135deg,#f43f5e,#a855f7)}
    .workout-card{position:relative;overflow:hidden}.workout-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--purple),var(--pink),var(--cyan))}
    .exercise-card{border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:13px;background:rgba(255,255,255,.06)}
    .setline{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;margin-top:8px}
    .setchip{display:inline-flex;align-items:center;gap:7px;margin:6px 6px 0 0;padding:8px 9px;border-radius:999px;background:rgba(255,255,255,.085);border:1px solid var(--line);font-size:12px;font-weight:850;color:#efe7ff}
    .setchip button{border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;width:22px;height:22px;font-weight:1000}
    .prevline{font-size:12px;color:#d9ceeb;margin-top:8px;padding:8px 9px;background:rgba(255,255,255,.055);border-radius:14px;border:1px solid rgba(255,255,255,.09)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:86px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.06);padding:7px;font-size:11px;overflow:hidden}.day.out{opacity:.45}.day .num{font-weight:1000;font-size:14px;margin-bottom:7px;color:white}.day.today{border-color:rgba(236,72,153,.75);box-shadow:0 0 0 2px rgba(236,72,153,.14),0 0 22px rgba(236,72,153,.22)}.calmarks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.calmark{min-height:35px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);font-weight:1000}.calmark .icon-svg{width:16px;height:16px;stroke-width:1.9}.calmark.ok{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.68);box-shadow:0 0 14px rgba(74,222,128,.38);color:#ecfff4}.calmark.no{background:rgba(251,113,133,.17);border-color:rgba(251,113,133,.42);color:#ffdce3}.weekday{font-size:10px;text-align:center;color:var(--muted);font-weight:1000;text-transform:uppercase;letter-spacing:.05em}
    .barbox{height:200px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;padding:8px;margin-top:10px;overflow-x:auto}.bar{min-width:36px;background:linear-gradient(180deg,var(--pink),var(--purple));border-radius:12px 12px 0 0;position:relative;box-shadow:0 12px 24px rgba(168,85,247,.18)}.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:900}.bar i{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;color:#fff;font-weight:900}
    .hidden{display:none!important}.divider{height:1px;background:var(--line);margin:13px 0}.spacer{height:8px}
    @media(max-width:390px){.wrap{padding:12px}.grid{gap:8px}.metric{min-height:104px;padding:12px}.metric b{font-size:19px}.metric span{font-size:10px}.bigcheck{width:32px;height:32px;font-size:20px}.day{min-height:78px;padding:5px}.calmarks{gap:3px}.calmark{min-height:30px;border-radius:10px}.calmark em{font-size:8px}.calmark strong{font-size:12px}.setline{grid-template-columns:1fr 1fr}.setline .btn{grid-column:1/-1}.tab{flex-basis:88px;min-height:68px}header h1{font-size:24px}.logo{width:44px;height:44px}}
    @media(min-width:700px){.two{grid-template-columns:1fr 1fr}.tabs{max-width:980px;left:50%;transform:translateX(-50%);border-radius:30px 30px 0 0}.day{min-height:104px}.wrap{padding:20px}.setline{grid-template-columns:1fr 1fr 140px}}
  </style>
</head>
<body>
<header>
  <div class="head-inner">
    <div class="logo">A1</div>
    <div><h1>All In One Fit</h1><p>Dark purple training, protein, habits and weekly goals.</p></div>
  </div>
</header>
<main class="wrap">
  <section id="dashboard" class="section active"></section>
  <section id="gym" class="section"></section>
  <section id="nutrition" class="section"></section>
  <section id="habits" class="section"></section>
  <section id="calendar" class="section"></section>
  <section id="progress" class="section"></section>
</main>
<nav class="tabs">
  <button class="tab active" data-tab="dashboard"><span>01</span><span>Home</span></button>
  <button class="tab" data-tab="gym"><span>02</span><span>Gym</span></button>
  <button class="tab" data-tab="nutrition"><span>03</span><span>Food</span></button>
  <button class="tab" data-tab="habits"><span>04</span><span>Habits</span></button>
  <button class="tab" data-tab="calendar"><span>05</span><span>Calendar</span></button>
  <button class="tab" data-tab="progress"><span>06</span><span>Progress</span></button>
</nav>
<script>
(function(){
'use strict';
const KEY='all_in_one_fit_one_file_v1';
const EXERCISES=['Bench Press','Incline Bench Press','Decline Bench Press','Dumbbell Bench Press','Chest Press Machine','Cable Fly','Pec Deck','Push Up','Shoulder Press','Dumbbell Shoulder Press','Arnold Press','Lateral Raise','Front Raise','Rear Delt Fly','Face Pull','Upright Row','Pull Up','Chin Up','Lat Pulldown','Seated Cable Row','Barbell Row','Dumbbell Row','T Bar Row','Straight Arm Pulldown','Deadlift','Romanian Deadlift','Back Extension','Squat','Front Squat','Leg Press','Hack Squat','Lunge','Walking Lunge','Bulgarian Split Squat','Leg Extension','Leg Curl','Seated Leg Curl','Calf Raise','Hip Thrust','Glute Bridge','Bicep Curl','Hammer Curl','Preacher Curl','Cable Curl','Tricep Pushdown','Overhead Tricep Extension','Skull Crusher','Close Grip Bench Press','Dip','Plank','Side Plank','Crunch','Cable Crunch','Hanging Leg Raise','Russian Twist','Ab Wheel','Treadmill Run','Bike','Rowing Machine','Stairmaster','Elliptical','Kettlebell Swing','Clean and Press','Farmer Carry','Goblet Squat','Box Jump','Sled Push','Battle Ropes','Hip Abduction','Hip Adduction','Smith Machine Squat','Smith Machine Bench Press'];
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
let ui={progressExercise:'Bench Press', recentExercise:'Bench Press', nutritionDate:today(), habitDate:today()};
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return fmt(new Date())}
function monthKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function ymdToDate(s){let a=String(s||today()).split('-').map(Number); return new Date(a[0],(a[1]||1)-1,a[2]||1,12,0,0)}
function id(){return Math.random().toString(36).slice(2,10)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function blank(){return {exercises:EXERCISES.slice(), workouts:[], nutrition:{}, habits:[{id:id(),name:'Steps or walk',done:{}},{id:id(),name:'Drink water',done:{}},{id:id(),name:'Sleep routine',done:{}}], goals:{protein:160,calories:2400,weeklyWorkouts:3}, draftWorkout:{date:today(),title:'',exercises:[]}}}
function normalise(raw){let base=blank(); let s=Object.assign(base,raw||{}); s.exercises=Array.isArray(s.exercises)?Array.from(new Set(s.exercises.concat(EXERCISES))).sort():EXERCISES.slice(); s.workouts=Array.isArray(s.workouts)?s.workouts:[]; s.nutrition=s.nutrition||{}; s.habits=Array.isArray(s.habits)?s.habits:base.habits; s.goals=Object.assign(base.goals,s.goals||{}); s.workouts.forEach(w=>{w.id=w.id||id(); w.exercises=Array.isArray(w.exercises)?w.exercises:[]; w.exercises.forEach(e=>{e.id=e.id||id(); e.sets=Array.isArray(e.sets)?e.sets:[]})}); if(!s.draftWorkout||!Array.isArray(s.draftWorkout.exercises))s.draftWorkout={date:today(),title:'',exercises:[]}; if(!s.draftWorkout.date)s.draftWorkout.date=today(); s.draftWorkout.exercises.forEach(e=>{e.id=e.id||id(); e.sets=Array.isArray(e.sets)?e.sets:[]}); return s}
let state=normalise(load());
function save(skipRender){localStorage.setItem(KEY,JSON.stringify(state)); if(!skipRender)render()}
function category(name){name=String(name).toLowerCase(); if(/run|bike|rowing|rower|stair|elliptical|treadmill|battle|sled|box jump/.test(name))return 'cardio'; if(/plank|crunch|leg raise|russian|ab wheel|cable crunch/.test(name))return 'core'; if(/squat|leg|lunge|calf|hip|glute|abduction|adduction/.test(name))return 'legs'; if(/pulldown|pull up|chin|row|deadlift|extension/.test(name))return 'back'; if(/shoulder|press|arnold|lateral|front raise|rear delt|face pull|upright/.test(name))return 'shoulders'; if(/curl|tricep|skull|dip|close grip/.test(name))return 'arms'; if(/bench|chest|fly|pec|push up/.test(name))return 'chest'; return 'full'}
function catText(cat){return {chest:'Chest',back:'Back',legs:'Legs',shoulders:'Shoulders',arms:'Arms',core:'Core',cardio:'Cardio',full:'Full body'}[cat]||'Lift'}
function svg(type, cls='icon-svg'){const icons={
  dumbbell:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M3 10v4"></path><path d="M6 8v8"></path><path d="M9 9v6"></path><path d="M15 9v6"></path><path d="M18 8v8"></path><path d="M21 10v4"></path><path d="M6 12h12"></path></svg>`,
  habits:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M7 7a7 7 0 0 1 10.5 1"></path><path d="M18 4v4h-4"></path><path d="M17 17a7 7 0 0 1-10.5-1"></path><path d="M6 20v-4h4"></path></svg>`,
  steak:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M8.5 6.5c1.8-1.5 4.8-2 7.1-.9 3.2 1.6 4.2 5.5 2.3 8.3-1.9 2.8-5.8 4.1-9.2 3.2C5.4 16.3 4 13.1 4.8 10.2c.4-1.4 1.5-2.7 3.7-3.7z"></path><circle cx="15.8" cy="10" r="1.8"></circle><path d="M7.6 14.8c.8.7 2.1 1.2 3.5 1.2"></path></svg>`,
  chest:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M9 7c-1.8.6-3 2.1-3 4.2V15"></path><path d="M15 7c1.8.6 3 2.1 3 4.2V15"></path><path d="M9 7c.5 1.4 1.6 2.2 3 2.2S14.5 8.4 15 7"></path><path d="M8 15c1 .8 2.4 1.2 4 1.2S15 15.8 16 15"></path></svg>`,
  back:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M12 5v14"></path><path d="M8 8c.3 1.2 1.2 2.4 4 2.8"></path><path d="M16 8c-.3 1.2-1.2 2.4-4 2.8"></path><path d="M7.5 18c1-.9 2.4-1.4 4.5-1.4s3.5.5 4.5 1.4"></path></svg>`,
  legs:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M9 5v6l-2 4v4"></path><path d="M15 5v7l2 3v4"></path><path d="M7 19h3"></path><path d="M14 19h3"></path></svg>`,
  shoulders:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M8.5 8.5c0-1.9 1.6-3.5 3.5-3.5s3.5 1.6 3.5 3.5"></path><path d="M4.5 15c.6-2.5 2.7-4 5-4h5c2.3 0 4.4 1.5 5 4"></path><path d="M6.5 15c.6-1.4 1.7-2.2 3-2.2"></path><path d="M17.5 15c-.6-1.4-1.7-2.2-3-2.2"></path></svg>`,
  arms:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M8 14c1.2-2.4 1.8-4.1 1.8-5.2h2.4c.6 0 1.1.2 1.4.6l2 2.5"></path><path d="M8 14c.7 2.1 2.5 3.2 5.2 3.2 2.1 0 3.7-.7 4.8-2.2"></path><path d="M7 14.5H4.5"></path></svg>`,
  core:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M9 5h6l1 5-1 9h-6L8 10l1-5z"></path><path d="M12 5v14"></path><path d="M9.5 10h5"></path><path d="M9.8 14h4.4"></path></svg>`,
  cardio:`<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true"><path d="M5 15.5c2.4-.1 3.6-1.6 4.7-4.6l2.2 4h2l1.5-3H19"></path><path d="M6 18.5h11"></path></svg>`
}; return icons[type]||icons.dumbbell}
function catGlyph(cat){return {chest:'chest',back:'back',legs:'legs',shoulders:'shoulders',arms:'arms',core:'core',cardio:'cardio',full:'dumbbell'}[cat]||'dumbbell'}
function icon(name, small){let c=category(name); return `<span class="${small?'miniicon':'exicon'} cat-${c}">${svg(catGlyph(c), 'icon-svg')}</span>`}
function trackerIcon(kind, small){let t={gym:'dumbbell',habits:'habits',protein:'steak'}[kind]||'dumbbell'; return svg(t, small?'icon-svg':'icon-svg')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function weekStart(dstr){let d=ymdToDate(dstr); let day=d.getDay(); let diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); return fmt(d)}
function weekDates(dstr){let start=ymdToDate(weekStart(dstr)); return Array.from({length:7},(_,i)=>{let d=new Date(start); d.setDate(start.getDate()+i); return fmt(d)})}
function workoutsOn(d){return state.workouts.filter(w=>w.date===d)}
function gymDone(d){return workoutsOn(d).length>0}
function proteinDone(d){let n=state.nutrition[d]||{}; return Number(n.protein||0)>=Number(state.goals.protein||0)}
function habitsDone(d){return state.habits.length>0 && state.habits.every(h=>h.done&&h.done[d])}
function dailyScore(d){return [gymDone(d),habitsDone(d),proteinDone(d)]}
function weeklyWorkoutCount(d){let ds=weekDates(d); return state.workouts.filter(w=>ds.includes(w.date)).length}
function setTab(name){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name)); $$('.section').forEach(s=>s.classList.toggle('active',s.id===name)); render()}
function render(){renderDashboard(); renderGym(); renderNutrition(); renderHabits(); renderCalendar(); renderProgress()}
function nutritionForm(d,prefix){let n=state.nutrition[d]||{calories:'',protein:''}; return `<label>Calories</label><input id="${prefix}_cal" type="number" value="${n.calories||''}" placeholder="${state.goals.calories}"><label>Protein grams</label><input id="${prefix}_pro" type="number" value="${n.protein||''}" placeholder="${state.goals.protein}"><button class="btn full" onclick="app.saveNutrition('${d}','${prefix}')">Save nutrition</button>`}
function habitChecklist(d,prefix,showSave){if(!state.habits.length)return '<p class="muted">No habits yet. Add some on the Habits tab.</p>'; return '<div class="list">'+state.habits.map(h=>`<label class="item row"><span>${esc(h.name)}</span><input id="${prefix}_habit_${h.id}" style="width:auto;min-height:auto" type="checkbox" ${h.done&&h.done[d]?'checked':''}></label>`).join('')+'</div>'+(showSave?`<button class="btn full" onclick="app.saveHabitsForDate('${d}','${prefix}')">Save habits</button>`:'')}
function renderDashboard(){let d=today(), score=dailyScore(d), week=weeklyWorkoutCount(d), goal=Number(state.goals.weeklyWorkouts||3), workouts=workoutsOn(d); $('#dashboard').innerHTML=`
 <div class="card hero"><h2>Today</h2><p class="muted">${new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})}</p><div class="row wraprow"><span class="pill">${week} / ${goal} workouts this week</span><span class="pill">${state.nutrition[d]?.protein||0}g protein</span><span class="pill">${workouts.length} gym log${workouts.length===1?'':'s'} today</span></div></div>
 <div class="grid"><div class="card metric ${score[0]?'done':'miss'}">${score[0]?'<div class="bigcheck">✓</div>':''}<div class="pill">${trackerIcon('gym',true)}<span style="font-size:11px;color:inherit;letter-spacing:.04em">Gym</span></div><b>${score[0]?'Complete':'Missing'}</b><span>Gym today</span></div><div class="card metric ${score[1]?'done':'miss'}">${score[1]?'<div class="bigcheck">✓</div>':''}<div class="pill">${trackerIcon('habits',true)}<span style="font-size:11px;color:inherit;letter-spacing:.04em">Habits</span></div><b>${score[1]?'Complete':'Missing'}</b><span>Habits today</span></div><div class="card metric ${score[2]?'done':'miss'}">${score[2]?'<div class="bigcheck">✓</div>':''}<div class="pill">${trackerIcon('protein',true)}<span style="font-size:11px;color:inherit;letter-spacing:.04em">Protein</span></div><b>${score[2]?'Complete':'Missing'}</b><span>Protein goal</span></div></div>
 <div class="card"><h2>This week</h2><p><b>${week} / ${goal}</b> workouts completed Monday to Sunday.</p><div class="notice">Each saved workout counts once, even if that workout contains multiple exercises.</div></div>
 <div class="two"><div class="card"><h3>Quick nutrition today</h3>${nutritionForm(d,'dash')}</div><div class="card"><h3>Today habits</h3>${habitChecklist(d,'dash',true)}</div></div>
 <div class="card"><h3>Settings</h3><div class="row"><div><label>Protein goal (g)</label><input id="goalProtein" type="number" value="${state.goals.protein}"></div><div><label>Calories goal</label><input id="goalCalories" type="number" value="${state.goals.calories}"></div></div><label>Weekly workout goal</label><input id="goalWeekly" type="number" value="${state.goals.weeklyWorkouts}"><button class="btn full" onclick="app.saveGoals()">Save goals</button></div>`}
function exerciseOptions(selected){return state.exercises.map(e=>`<option value="${esc(e)}" ${e===selected?'selected':''}>${esc(e)}</option>`).join('')}
function renderGym(){let d=state.draftWorkout; if(!d.date)d.date=today(); let selected=ui.recentExercise||state.exercises[0]; $('#gym').innerHTML=`
 <div class="card workout-card"><h2>Build workout</h2><p class="muted">Add as many exercises as you want, then save the whole workout once.</p><label>Date</label><input id="workoutDate" type="date" value="${d.date}" onchange="app.setDraftDate(this.value)"><label>Workout name optional</label><input id="workoutTitle" value="${esc(d.title||'')}" placeholder="Push day, Pull day, Legs..." oninput="app.setDraftTitle(this.value)"><div class="divider"></div><label>Add exercise</label><div class="row"><select id="exerciseSelect" onchange="app.pickExercise(this.value)">${exerciseOptions(selected)}</select><button class="btn" onclick="app.addExerciseToWorkout()">Add</button></div><div class="prevline">The icons now use simple built-in line art, so the app looks cleaner and still stays safe for GitHub Pages.</div></div>
 <div class="card"><h3>Current workout</h3>${draftWorkoutHtml()}<button class="btn full" onclick="app.saveWorkout()">Save full workout</button><button class="btn secondary full" onclick="app.clearDraft()">Clear draft</button></div>
 <div class="card"><h3>Previous sets for ${esc(selected)}</h3>${previousSets(selected)}</div>
 <div class="card"><h3>Add custom exercise</h3><div class="row"><input id="newExercise" placeholder="Exercise name"><button class="btn" onclick="app.addCustomExercise()">Add</button></div><p class="muted small">Custom exercises get an automatic simple icon based on the exercise type.</p></div>
 <div class="card"><h3>Recent workouts</h3>${recentWorkouts()}</div>`}
function draftWorkoutHtml(){let list=state.draftWorkout.exercises||[]; if(!list.length)return '<p class="muted">No exercises added yet. Choose an exercise above and tap Add.</p>'; return '<div class="list">'+list.map((e,idx)=>`<div class="exercise-card"><div class="exrow">${icon(e.name)}<div class="excopy"><div class="exname">${esc(e.name)}</div><div class="exmeta">${catText(category(e.name))} · ${e.sets.length} set${e.sets.length===1?'':'s'}</div></div><button class="btn danger smallbtn" onclick="app.removeExerciseFromDraft(${idx})">Remove</button></div><div class="prevline">Last time: ${previousSetsText(e.name)}</div><div class="setline"><div><label>Weight kg</label><input id="w_${e.id}" type="number" step="0.5" placeholder="0"></div><div><label>Reps</label><input id="r_${e.id}" type="number" placeholder="0"></div><button class="btn" onclick="app.addSetToExercise('${e.id}')">Add set</button></div><div>${e.sets.map((s,i)=>`<span class="setchip">${s.weight} kg x ${s.reps}<button onclick="app.removeSetFromExercise('${e.id}',${i})">x</button></span>`).join('')||'<p class="muted small">No sets yet for this exercise.</p>'}</div></div>`).join('')+'</div>'}
function previousSets(name){let matches=[]; state.workouts.slice().reverse().forEach(w=>(w.exercises||[]).forEach(e=>{if(e.name===name && matches.length<6)matches.push({date:w.date,sets:e.sets||[]})})); if(!matches.length)return '<p class="muted">No previous sets yet.</p>'; return '<div class="list">'+matches.map(m=>`<div class="item"><b>${m.date}</b><br><span class="muted">${m.sets.map(s=>`${s.weight} kg x ${s.reps}`).join(', ')}</span></div>`).join('')+'</div>'}
function previousSetsText(name){let latest=null; state.workouts.slice().reverse().some(w=>(w.exercises||[]).some(e=>{if(e.name===name){latest={date:w.date,sets:e.sets||[]}; return true} return false})); return latest?`${latest.date}: ${latest.sets.map(s=>`${s.weight} x ${s.reps}`).join(', ')}`:'no history yet'}
function recentWorkouts(){let ws=state.workouts.slice().reverse().slice(0,8); if(!ws.length)return '<p class="muted">No workouts logged yet.</p>'; return '<div class="list">'+ws.map(w=>`<div class="item"><div class="row"><div><b>${w.date}${w.title?' · '+esc(w.title):''}</b><br><span class="muted">${(w.exercises||[]).map(e=>e.name).join(', ')}</span></div><button class="btn danger smallbtn" onclick="app.deleteWorkout('${w.id}')">Delete</button></div></div>`).join('')+'</div>'}
function renderNutrition(){let d=ui.nutritionDate||today(); $('#nutrition').innerHTML=`<div class="card"><h2>Calories and protein</h2><p class="muted">Pick any date, enter calories/protein, then save. Today and past days use the same save path now.</p><label>Date</label><input id="nutritionDate" type="date" value="${d}" onchange="app.setNutritionDate(this.value)">${nutritionForm(d,'nutrition')}</div><div class="card"><h3>Last 14 days</h3>${nutritionHistory()}</div>`}
function nutritionHistory(){let out=[]; for(let i=13;i>=0;i--){let d=new Date(); d.setDate(d.getDate()-i); let k=fmt(d), n=state.nutrition[k]||{}; out.push(`<div class="item row"><span>${k}</span><span class="right">${n.calories||0} cal / ${n.protein||0}g protein</span></div>`)} return '<div class="list">'+out.join('')+'</div>'}
function renderHabits(){let d=ui.habitDate||today(); $('#habits').innerHTML=`<div class="card"><h2>Habits</h2><p class="muted">Tick the habits for the selected date, then tap Save habits.</p><label>Date</label><input id="habitDate" type="date" value="${d}" onchange="app.setHabitDate(this.value)">${habitChecklist(d,'habits',true)}</div><div class="card"><h3>Add habit</h3><div class="row"><input id="newHabit" placeholder="Habit name"><button class="btn" onclick="app.addHabit()">Add</button></div></div><div class="card"><h3>Manage habits</h3>${state.habits.map(h=>`<div class="item row"><span>${esc(h.name)}</span><button class="btn danger smallbtn" onclick="app.deleteHabit('${h.id}')">Delete</button></div>`).join('')||'<p class="muted">No habits.</p>'}</div>`}
function renderCalendar(){let base=$('#monthPick')?.value||monthKey(new Date()); let parts=base.split('-').map(Number), first=new Date(parts[0],parts[1]-1,1,12), start=new Date(first); let offset=(first.getDay()+6)%7; start.setDate(first.getDate()-offset); let cells=[]; for(let i=0;i<42;i++){let d=new Date(start); d.setDate(start.getDate()+i); let k=fmt(d), s=dailyScore(k), out=d.getMonth()!==first.getMonth()?' out':'', isToday=k===today()?' today':''; cells.push(`<div class="day${out}${isToday}"><div class="num">${d.getDate()}</div><div class="calmarks"><span class="calmark ${s[0]?'ok':'no'}" title="Gym">${trackerIcon('gym',true)}</span><span class="calmark ${s[1]?'ok':'no'}" title="Habits">${trackerIcon('habits',true)}</span><span class="calmark ${s[2]?'ok':'no'}" title="Protein">${trackerIcon('protein',true)}</span></div></div>`)} $('#calendar').innerHTML=`<div class="card"><h2>Calendar</h2><p class="muted">Simple icons now show gym, habits and protein. Green glow = complete. Red = incomplete.</p><label>Month</label><input id="monthPick" type="month" value="${base}" onchange="app.render()"><div class="row tight wraprow" style="margin:10px 0 12px;gap:8px"><span class="pill">${trackerIcon('gym',true)} Gym</span><span class="pill">${trackerIcon('habits',true)} Habits</span><span class="pill">${trackerIcon('protein',true)} Protein</span></div><div class="calendar" style="margin-top:10px"><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div>${cells.join('')}</div></div>`}
function renderProgress(){let selected=$('#progressExercise')?.value||ui.progressExercise||state.exercises[0]; ui.progressExercise=selected; let pts=progressPoints(selected); let max=Math.max(1,...pts.map(p=>p.value)); let bars=pts.slice(-12).map(p=>`<div class="bar" style="height:${Math.max(8,(p.value/max)*150)}px"><i>${p.value}</i><span>${p.date.slice(5)}</span></div>`).join('')||'<p class="muted">No data yet.</p>'; $('#progress').innerHTML=`<div class="card"><h2>Progress</h2><label>Exercise</label><select id="progressExercise" onchange="app.setProgressExercise(this.value)">${exerciseOptions(selected)}</select><p class="muted">Chart shows best estimated one rep max per workout: weight x (1 + reps / 30).</p><div class="barbox">${bars}</div></div><div class="card"><h3>Exercise icons</h3><p class="muted">Each workout type now has a simple built-in icon, including a rounded shoulder icon for shoulder work. No image uploads needed.</p><div class="row wraprow">${['Bench Press','Lat Pulldown','Squat','Shoulder Press','Bicep Curl','Plank','Treadmill Run','Clean and Press'].map(n=>`<span class="pill">${icon(n,true)} ${catText(category(n))}</span>`).join('')}</div></div><div class="card"><h3>Backup</h3><button class="btn full" onclick="app.exportData()">Export JSON backup</button><label>Import JSON backup</label><textarea id="importBox" rows="5" placeholder="Paste backup here"></textarea><button class="btn secondary full" onclick="app.importData()">Import backup</button></div>`}
function progressPoints(ex){let pts=[]; state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>{if(e.name===ex){let best=0; (e.sets||[]).forEach(s=>{let val=Number(s.weight)*(1+Number(s.reps)/30); if(val>best)best=val}); if(best)pts.push({date:w.date,value:Math.round(best)})}})); return pts}
window.app={
  render,
  setTab,
  setNutritionDate(v){ui.nutritionDate=v||today(); renderNutrition()},
  setHabitDate(v){ui.habitDate=v||today(); renderHabits()},
  pickExercise(v){ui.recentExercise=v; renderGym()},
  setProgressExercise(v){ui.progressExercise=v; renderProgress()},
  setDraftDate(v){state.draftWorkout.date=v||today(); save(true)},
  setDraftTitle(v){state.draftWorkout.title=v; save(true)},
  addExerciseToWorkout(){let ex=$('#exerciseSelect').value; ui.recentExercise=ex; if(!state.draftWorkout.exercises.some(e=>e.name===ex))state.draftWorkout.exercises.push({id:id(),name:ex,sets:[]}); save()},
  removeExerciseFromDraft(i){state.draftWorkout.exercises.splice(i,1); save()},
  addSetToExercise(eid){let e=state.draftWorkout.exercises.find(x=>x.id===eid); if(!e)return; let w=Number($('#w_'+eid).value), r=Number($('#r_'+eid).value); if(!w||!r)return alert('Enter weight and reps.'); e.sets.push({weight:w,reps:r}); save()},
  removeSetFromExercise(eid,i){let e=state.draftWorkout.exercises.find(x=>x.id===eid); if(e){e.sets.splice(i,1); save()}},
  saveWorkout(){let d=state.draftWorkout; if(!d.exercises.length)return alert('Add at least one exercise.'); if(d.exercises.some(e=>!e.sets.length))return alert('Every exercise needs at least one set.'); state.workouts.push({id:id(),date:d.date||today(),title:(d.title||'').trim(),exercises:d.exercises.map(e=>({id:id(),name:e.name,sets:e.sets.slice()}))}); state.draftWorkout={date:d.date||today(),title:'',exercises:[]}; save(); alert('Workout saved.')},
  clearDraft(){if(confirm('Clear current workout draft?')){state.draftWorkout={date:today(),title:'',exercises:[]}; save()}},
  deleteWorkout(wid){state.workouts=state.workouts.filter(w=>w.id!==wid); save()},
  addCustomExercise(){let v=$('#newExercise').value.trim(); if(v&&!state.exercises.includes(v)){state.exercises.push(v); state.exercises.sort(); ui.recentExercise=v; save()}},
  saveNutrition(d,prefix){state.nutrition[d]={calories:Number($('#'+prefix+'_cal')?.value||0),protein:Number($('#'+prefix+'_pro')?.value||0)}; save()},
  saveHabitsForDate(d,prefix){state.habits.forEach(h=>{h.done=h.done||{}; h.done[d]=!!$('#'+prefix+'_habit_'+h.id)?.checked}); save()},
  toggleHabit(hid,d){let h=state.habits.find(x=>x.id===hid); if(h){h.done=h.done||{}; h.done[d]=!h.done[d]; save()}},
  addHabit(){let v=$('#newHabit').value.trim(); if(v){state.habits.push({id:id(),name:v,done:{}}); save()}},
  deleteHabit(hid){state.habits=state.habits.filter(h=>h.id!==hid); save()},
  saveGoals(){state.goals.protein=Number($('#goalProtein').value||0); state.goals.calories=Number($('#goalCalories').value||0); state.goals.weeklyWorkouts=Number($('#goalWeekly').value||0); save()},
  exportData(){let text=JSON.stringify(state,null,2); if(navigator.clipboard)navigator.clipboard.writeText(text); let blob=new Blob([text],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='all-in-one-fit-backup.json'; a.click()},
  importData(){try{state=normalise(JSON.parse($('#importBox').value)); save(); alert('Backup imported.')}catch(e){alert('That JSON backup was not valid.')}}
};
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
save(true); render();
})();
</script>
</body>
</html>
