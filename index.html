<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="All In One Fit">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>All In One Fit</title>
  <style>
    :root{
      --bg:#070a13;
      --bg2:#0c1224;
      --card:rgba(255,255,255,.075);
      --card-strong:rgba(255,255,255,.115);
      --text:#f8fafc;
      --muted:#a8b3c7;
      --line:rgba(255,255,255,.12);
      --line-strong:rgba(255,255,255,.22);
      --dark:#111827;
      --soft:rgba(255,255,255,.08);
      --ok:#45f0b5;
      --ok-bg:rgba(69,240,181,.16);
      --bad:#ff6b8a;
      --bad-bg:rgba(255,107,138,.15);
      --warn:#ffd166;
      --accent:#8b5cf6;
      --accent2:#06b6d4;
      --accent3:#22c55e;
      --shadow:0 22px 60px rgba(0,0,0,.35);
      --radius:24px;
      color-scheme:dark;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{min-height:100%;background:var(--bg)}
    body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Arial,sans-serif;
      background:
        radial-gradient(circle at 18% 0%,rgba(139,92,246,.34),transparent 34%),
        radial-gradient(circle at 92% 8%,rgba(6,182,212,.24),transparent 30%),
        radial-gradient(circle at 70% 92%,rgba(34,197,94,.14),transparent 32%),
        linear-gradient(180deg,#070a13 0%,#0b1020 45%,#070a13 100%);
      color:var(--text);
      padding-bottom:calc(132px + env(safe-area-inset-bottom));
      overflow-x:hidden;
    }
    body:before{
      content:"";
      position:fixed;inset:0;
      background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
      background-size:34px 34px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 58%);
      pointer-events:none;
    }
    header{
      position:sticky;top:0;z-index:5;
      padding:calc(18px + env(safe-area-inset-top)) 16px 16px;
      background:linear-gradient(180deg,rgba(7,10,19,.96),rgba(7,10,19,.78));
      backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
      border-bottom:1px solid rgba(255,255,255,.09);
    }
    header:after{
      content:"";display:block;height:1px;margin-top:14px;
      background:linear-gradient(90deg,transparent,rgba(139,92,246,.65),rgba(6,182,212,.65),transparent);
    }
    header h1{margin:0;font-size:28px;letter-spacing:-.04em;line-height:1;font-weight:900}
    header p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.35}
    .wrap{max-width:980px;margin:0 auto;padding:16px;position:relative;z-index:1}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .two{display:grid;grid-template-columns:1fr;gap:12px}
    .card{
      background:linear-gradient(180deg,var(--card-strong),var(--card));
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:16px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
      margin-bottom:14px;
      backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    }
    .metric{
      min-height:116px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative;
    }
    .metric:before{
      content:"";position:absolute;right:-26px;top:-28px;width:86px;height:86px;border-radius:999px;background:rgba(255,255,255,.08);
    }
    .metric b{display:block;font-size:22px;letter-spacing:-.03em;position:relative}
    .metric span{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;position:relative}
    .metric.done{background:linear-gradient(145deg,rgba(34,197,94,.25),rgba(255,255,255,.07))!important;border-color:rgba(69,240,181,.32)!important}
    .metric.miss{background:linear-gradient(145deg,rgba(255,107,138,.22),rgba(255,255,255,.07))!important;border-color:rgba(255,107,138,.28)!important}
    h2{font-size:22px;letter-spacing:-.035em;margin:0 0 12px}
    h3{font-size:17px;letter-spacing:-.025em;margin:0 0 12px}
    p{line-height:1.45}.muted{color:var(--muted);font-size:13px}.small{font-size:12px}.right{text-align:right}
    .row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.row.tight>*{flex:0 0 auto}
    .btn{
      border:0;border-radius:16px;padding:13px 14px;font-weight:900;
      background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;cursor:pointer;
      box-shadow:0 12px 24px rgba(6,182,212,.16);font-size:15px;
    }
    .btn:active{transform:translateY(1px);filter:brightness(.95)}
    .btn.secondary{background:rgba(255,255,255,.11);color:var(--text);box-shadow:none;border:1px solid var(--line)}
    .btn.danger{background:rgba(255,107,138,.16);color:#ffd3dc;box-shadow:none;border:1px solid rgba(255,107,138,.24)}
    .btn.good{background:var(--ok-bg);color:#d7fff0;box-shadow:none;border:1px solid rgba(69,240,181,.25)}
    .btn.full{width:100%;margin-top:12px}
    input,select,textarea{
      width:100%;padding:14px 13px;border:1px solid var(--line);border-radius:16px;
      background:rgba(255,255,255,.08);color:var(--text);font-size:16px;outline:none;
    }
    select option{background:#111827;color:white}
    input::placeholder,textarea::placeholder{color:#718096}
    input:focus,select:focus,textarea:focus{border-color:rgba(6,182,212,.72);box-shadow:0 0 0 4px rgba(6,182,212,.13)}
    label{display:block;font-size:12px;font-weight:900;color:#d8e1f3;margin:10px 0 6px;text-transform:uppercase;letter-spacing:.07em}
    .hidden{display:none!important}
    .tabs{
      position:fixed;left:0;right:0;bottom:0;z-index:10;
      display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;
      padding:10px 10px calc(12px + env(safe-area-inset-bottom));
      background:rgba(7,10,19,.82);border-top:1px solid rgba(255,255,255,.12);
      backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
      box-shadow:0 -18px 40px rgba(0,0,0,.36);
      scrollbar-width:none;
    }
    .tabs::-webkit-scrollbar{display:none}
    .tab{
      flex:0 0 88px;min-height:62px;border:1px solid rgba(255,255,255,.1);border-radius:20px;
      background:rgba(255,255,255,.07);color:var(--muted);font-size:12px;font-weight:900;
      display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 10px;
    }
    .tab.active{color:white;background:linear-gradient(135deg,rgba(139,92,246,.95),rgba(6,182,212,.85));border-color:rgba(255,255,255,.24);box-shadow:0 12px 26px rgba(139,92,246,.24)}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;background:rgba(255,255,255,.07);font-size:12px}
    .done{background:var(--ok-bg)!important;border-color:rgba(69,240,181,.28)!important}.miss{background:var(--bad-bg)!important;border-color:rgba(255,107,138,.26)!important}
    .list{display:flex;flex-direction:column;gap:10px}.item{border:1px solid var(--line);background:rgba(255,255,255,.065);border-radius:18px;padding:12px}.item-title{font-weight:900}
    .setline{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:92px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.065);padding:7px;font-size:11px;overflow:hidden}.day .num{font-weight:900;font-size:14px;margin-bottom:6px;color:white}.tick{display:block;border-radius:10px;padding:4px 5px;margin:3px 0;background:rgba(255,255,255,.08);white-space:nowrap;color:var(--muted);font-size:10px;font-weight:800}.tick.ok{background:var(--ok-bg);color:#d8fff1}.tick.no{background:var(--bad-bg);color:#ffd8df}.weekday{font-size:11px;text-align:center;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em}
    .barbox{height:190px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-end;padding:8px;margin-top:10px;overflow-x:auto}.bar{min-width:34px;background:linear-gradient(180deg,var(--accent2),var(--accent));border-radius:11px 11px 0 0;position:relative;box-shadow:0 10px 20px rgba(6,182,212,.12)}.bar span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);font-weight:800}
    .notice{background:rgba(255,209,102,.12);border:1px solid rgba(255,209,102,.26);color:#ffe7a1;border-radius:18px;padding:12px;font-size:13px}
    .section{display:none;animation:rise .18s ease-out}.section.active{display:block}
    @keyframes rise{from{opacity:.7;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:390px){.wrap{padding:12px}.grid{gap:8px}.metric{min-height:106px;padding:12px}.metric b{font-size:19px}.metric span{font-size:10px}.day{min-height:86px;padding:5px}.tick{font-size:9px;padding:3px 4px}.setline{grid-template-columns:1fr 1fr}.setline .btn{grid-column:1/-1}.tab{flex-basis:84px}}
    @media(min-width:700px){.two{grid-template-columns:1fr 1fr}.tabs{max-width:980px;left:50%;transform:translateX(-50%);border-radius:28px 28px 0 0}.day{min-height:104px}.wrap{padding:20px}}
  </style>
</head>
<body>
<header><h1>All In One Fit</h1><p>Your gym, protein, habits and weekly goals in one clean dashboard.</p></header>
<main class="wrap">
  <section id="dashboard" class="section active"></section>
  <section id="gym" class="section"></section>
  <section id="nutrition" class="section"></section>
  <section id="habits" class="section"></section>
  <section id="calendar" class="section"></section>
  <section id="progress" class="section"></section>
</main>
<nav class="tabs">
  <button class="tab active" data-tab="dashboard">Home</button>
  <button class="tab" data-tab="gym">Gym</button>
  <button class="tab" data-tab="nutrition">Food</button>
  <button class="tab" data-tab="habits">Habits</button>
  <button class="tab" data-tab="calendar">Calendar</button>
  <button class="tab" data-tab="progress">Progress</button>
</nav>
<script>
(function(){
'use strict';
const KEY='all_in_one_fit_one_file_v1';
const EXERCISES=['Bench Press','Incline Bench Press','Decline Bench Press','Dumbbell Bench Press','Chest Press Machine','Cable Fly','Pec Deck','Push Up','Shoulder Press','Dumbbell Shoulder Press','Arnold Press','Lateral Raise','Front Raise','Rear Delt Fly','Face Pull','Upright Row','Pull Up','Chin Up','Lat Pulldown','Seated Cable Row','Barbell Row','Dumbbell Row','T Bar Row','Straight Arm Pulldown','Deadlift','Romanian Deadlift','Back Extension','Squat','Front Squat','Leg Press','Hack Squat','Lunge','Walking Lunge','Bulgarian Split Squat','Leg Extension','Leg Curl','Seated Leg Curl','Calf Raise','Hip Thrust','Glute Bridge','Bicep Curl','Hammer Curl','Preacher Curl','Cable Curl','Tricep Pushdown','Overhead Tricep Extension','Skull Crusher','Close Grip Bench Press','Dip','Plank','Side Plank','Crunch','Cable Crunch','Hanging Leg Raise','Russian Twist','Ab Wheel','Treadmill Run','Bike','Rowing Machine','Stairmaster','Elliptical','Kettlebell Swing','Clean and Press','Farmer Carry','Goblet Squat','Box Jump','Sled Push','Battle Ropes','Hip Abduction','Hip Adduction','Smith Machine Squat','Smith Machine Bench Press'];
const $=s=>document.querySelector(s); const $$=s=>Array.from(document.querySelectorAll(s));
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return d.toISOString().slice(0,10)}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null}}
function save(){localStorage.setItem(KEY,JSON.stringify(state)); render()}
function blank(){return {exercises:EXERCISES, workouts:[], nutrition:{}, habits:[{id:id(),name:'Steps or walk',done:{}},{id:id(),name:'Drink water',done:{}},{id:id(),name:'Sleep routine',done:{}}], goals:{protein:160,calories:2400,weeklyWorkouts:3}, currentSets:[]}}
function id(){return Math.random().toString(36).slice(2,10)}
let state=load()||blank();
function ymdToDate(s){let a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2])}
function weekStart(dstr){let d=ymdToDate(dstr); let day=d.getDay(); let diff=(day===0?-6:1-day); d.setDate(d.getDate()+diff); return fmt(d)}
function weekDates(dstr){let start=ymdToDate(weekStart(dstr)); return Array.from({length:7},(_,i)=>{let d=new Date(start); d.setDate(start.getDate()+i); return fmt(d)})}
function workoutsOn(d){return state.workouts.filter(w=>w.date===d)}
function gymDone(d){return workoutsOn(d).length>0}
function proteinDone(d){let n=state.nutrition[d]||{}; return Number(n.protein||0)>=Number(state.goals.protein||0)}
function habitsDone(d){return state.habits.length>0 && state.habits.every(h=>h.done&&h.done[d])}
function dailyScore(d){return [gymDone(d),habitsDone(d),proteinDone(d)]}
function weeklyWorkoutCount(d){let ds=weekDates(d); return state.workouts.filter(w=>ds.includes(w.date)).length}
function activeTab(){return $('.tab.active').dataset.tab}
function setTab(name){$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name)); $$('.section').forEach(s=>s.classList.toggle('active',s.id===name)); render()}
function render(){renderDashboard(); renderGym(); renderNutrition(); renderHabits(); renderCalendar(); renderProgress()}
function renderDashboard(){let d=today(), score=dailyScore(d), week=weeklyWorkoutCount(d), goal=Number(state.goals.weeklyWorkouts||3); $('#dashboard').innerHTML=`
 <div class="grid"><div class="card metric ${score[0]?'done':'miss'}"><b>${score[0]?'Done':'No'}</b><span>Gym today</span></div><div class="card metric ${score[1]?'done':'miss'}"><b>${score[1]?'Done':'No'}</b><span>Habits today</span></div><div class="card metric ${score[2]?'done':'miss'}"><b>${score[2]?'Done':'No'}</b><span>Protein goal</span></div></div>
 <div class="card"><h2>This week</h2><p><b>${week} / ${goal}</b> workouts completed Monday to Sunday.</p><div class="notice">Use this as your pass/fail weekly goal. Change the target in Settings below.</div></div>
 <div class="two"><div class="card"><h3>Quick nutrition today</h3>${nutritionForm(d)}</div><div class="card"><h3>Today habits</h3>${habitChecklist(d)}</div></div>
 <div class="card"><h3>Settings</h3><div class="row"><div><label>Protein goal (g)</label><input id="goalProtein" type="number" value="${state.goals.protein}"></div><div><label>Calories goal</label><input id="goalCalories" type="number" value="${state.goals.calories}"></div></div><label>Weekly workout goal</label><input id="goalWeekly" type="number" value="${state.goals.weeklyWorkouts}"><button class="btn full" onclick="app.saveGoals()">Save goals</button></div>`}
function nutritionForm(d){let n=state.nutrition[d]||{calories:'',protein:''}; return `<label>Calories</label><input id="cal_${d}" type="number" value="${n.calories||''}" placeholder="${state.goals.calories}"><label>Protein grams</label><input id="pro_${d}" type="number" value="${n.protein||''}" placeholder="${state.goals.protein}"><button class="btn full" onclick="app.saveNutrition('${d}')">Save nutrition</button>`}
function habitChecklist(d){if(!state.habits.length)return '<p class="muted">No habits yet. Add some on the Habits tab.</p>'; return '<div class="list">'+state.habits.map(h=>`<label class="item row"><span>${esc(h.name)}</span><input style="width:auto" type="checkbox" ${h.done&&h.done[d]?'checked':''} onchange="app.toggleHabit('${h.id}','${d}')"></label>`).join('')+'</div>'}
function renderGym(){let opts=state.exercises.map(e=>`<option>${esc(e)}</option>`).join(''); let selected=$('#exerciseSelect')?.value||state.exercises[0]; let prev=previousSets(selected); let setRows=state.currentSets.map((s,i)=>`<div class="item row"><span>Set ${i+1}: ${s.weight} kg x ${s.reps}</span><button class="btn danger" onclick="app.removeCurrentSet(${i})">Delete</button></div>`).join('')||'<p class="muted">No sets added yet.</p>'; $('#gym').innerHTML=`<div class="card"><h2>Log workout</h2><label>Date</label><input id="workoutDate" type="date" value="${today()}"><label>Exercise</label><select id="exerciseSelect" onchange="app.exerciseChanged()">${opts}</select><div class="setline"><div><label>Weight kg</label><input id="setWeight" type="number" step="0.5"></div><div><label>Reps</label><input id="setReps" type="number"></div><button class="btn" onclick="app.addSet()">Add set</button></div><h3>Current sets</h3>${setRows}<button class="btn full" onclick="app.saveWorkout()">Save workout</button></div><div class="card"><h3>Previous sets for ${esc(selected)}</h3>${prev}</div><div class="card"><h3>Add custom exercise</h3><div class="row"><input id="newExercise" placeholder="Exercise name"><button class="btn" onclick="app.addExercise()">Add</button></div></div><div class="card"><h3>Recent workouts</h3>${recentWorkouts()}</div>`; if(selected){$('#exerciseSelect').value=selected}}
function previousSets(ex){let matches=[]; state.workouts.slice().reverse().forEach(w=>w.exercises.forEach(e=>{if(e.name===ex && matches.length<5)matches.push({date:w.date,sets:e.sets})})); if(!matches.length)return '<p class="muted">No previous sets yet.</p>'; return '<div class="list">'+matches.map(m=>`<div class="item"><b>${m.date}</b><br>${m.sets.map(s=>`${s.weight} kg x ${s.reps}`).join(', ')}</div>`).join('')+'</div>'}
function recentWorkouts(){let ws=state.workouts.slice().reverse().slice(0,8); if(!ws.length)return '<p class="muted">No workouts logged yet.</p>'; return '<div class="list">'+ws.map(w=>`<div class="item"><div class="row"><div><b>${w.date}</b><br><span class="muted">${w.exercises.map(e=>e.name).join(', ')}</span></div><button class="btn danger" onclick="app.deleteWorkout('${w.id}')">Delete</button></div></div>`).join('')+'</div>'}
function renderNutrition(){let d=$('#nutritionDate')?.value||today(); $('#nutrition').innerHTML=`<div class="card"><h2>Calories and protein</h2><label>Date</label><input id="nutritionDate" type="date" value="${d}" onchange="app.render()">${nutritionForm(d)}</div><div class="card"><h3>Last 14 days</h3>${nutritionHistory()}</div>`}
function nutritionHistory(){let out=[]; for(let i=13;i>=0;i--){let d=new Date(); d.setDate(d.getDate()-i); let k=fmt(d), n=state.nutrition[k]||{}; out.push(`<div class="item row"><span>${k}</span><span class="right">${n.calories||0} cal / ${n.protein||0}g protein</span></div>`)} return '<div class="list">'+out.join('')+'</div>'}
function renderHabits(){let d=$('#habitDate')?.value||today(); $('#habits').innerHTML=`<div class="card"><h2>Habits</h2><label>Date</label><input id="habitDate" type="date" value="${d}" onchange="app.render()">${habitChecklist(d)}</div><div class="card"><h3>Add habit</h3><div class="row"><input id="newHabit" placeholder="Habit name"><button class="btn" onclick="app.addHabit()">Add</button></div></div><div class="card"><h3>Manage habits</h3>${state.habits.map(h=>`<div class="item row"><span>${esc(h.name)}</span><button class="btn danger" onclick="app.deleteHabit('${h.id}')">Delete</button></div>`).join('')||'<p class="muted">No habits.</p>'}</div>`}
function renderCalendar(){let base=$('#monthPick')?.value||today().slice(0,7); let parts=base.split('-').map(Number), first=new Date(parts[0],parts[1]-1,1), start=new Date(first); let offset=(first.getDay()+6)%7; start.setDate(first.getDate()-offset); let cells=[]; for(let i=0;i<42;i++){let d=new Date(start); d.setDate(start.getDate()+i); let k=fmt(d), s=dailyScore(k), muted=d.getMonth()!==first.getMonth()?' muted':''; cells.push(`<div class="day${muted}"><div class="num">${d.getDate()}</div><span class="tick ${s[0]?'ok':'no'}">Gym ${s[0]?'yes':'no'}</span><span class="tick ${s[1]?'ok':'no'}">Habits ${s[1]?'yes':'no'}</span><span class="tick ${s[2]?'ok':'no'}">Protein ${s[2]?'yes':'no'}</span></div>`)} $('#calendar').innerHTML=`<div class="card"><h2>Calendar</h2><label>Month</label><input id="monthPick" type="month" value="${base}" onchange="app.render()"><div class="calendar" style="margin-top:10px"><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div>${cells.join('')}</div></div>`}
function renderProgress(){let selected=$('#progressExercise')?.value||state.exercises[0]; let opts=state.exercises.map(e=>`<option>${esc(e)}</option>`).join(''); let pts=progressPoints(selected); let max=Math.max(1,...pts.map(p=>p.value)); let bars=pts.slice(-12).map(p=>`<div class="bar" style="height:${Math.max(6,(p.value/max)*140)}px"><span>${p.date.slice(5)}</span></div>`).join('')||'<p class="muted">No data yet.</p>'; $('#progress').innerHTML=`<div class="card"><h2>Progress</h2><label>Exercise</label><select id="progressExercise" onchange="app.render()">${opts}</select><p class="muted">Chart shows best estimated one rep max per workout: weight x (1 + reps / 30).</p><div class="barbox">${bars}</div></div><div class="card"><h3>Backup</h3><button class="btn full" onclick="app.exportData()">Export JSON backup</button><label>Import JSON backup</label><textarea id="importBox" rows="5" placeholder="Paste backup here"></textarea><button class="btn secondary full" onclick="app.importData()">Import backup</button></div>`; $('#progressExercise').value=selected}
function progressPoints(ex){let pts=[]; state.workouts.forEach(w=>w.exercises.forEach(e=>{if(e.name===ex){let best=0; e.sets.forEach(s=>{let val=Number(s.weight)*(1+Number(s.reps)/30); if(val>best)best=val}); if(best)pts.push({date:w.date,value:Math.round(best)})}})); return pts}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
window.app={render, setTab, exerciseChanged(){renderGym()}, addSet(){let w=Number($('#setWeight').value), r=Number($('#setReps').value); if(!w||!r)return alert('Enter weight and reps.'); state.currentSets.push({weight:w,reps:r}); save()}, removeCurrentSet(i){state.currentSets.splice(i,1); save()}, saveWorkout(){let d=$('#workoutDate').value||today(), ex=$('#exerciseSelect').value; if(!state.currentSets.length)return alert('Add at least one set.'); state.workouts.push({id:id(),date:d,exercises:[{name:ex,sets:state.currentSets.slice()}]}); state.currentSets=[]; save(); alert('Workout saved.')}, deleteWorkout(wid){state.workouts=state.workouts.filter(w=>w.id!==wid); save()}, addExercise(){let v=$('#newExercise').value.trim(); if(v&&!state.exercises.includes(v)){state.exercises.push(v); state.exercises.sort(); save()}}, saveNutrition(d){state.nutrition[d]={calories:Number($('#cal_'+d).value||0),protein:Number($('#pro_'+d).value||0)}; save()}, toggleHabit(hid,d){let h=state.habits.find(x=>x.id===hid); if(h){h.done=h.done||{}; h.done[d]=!h.done[d]; save()}}, addHabit(){let v=$('#newHabit').value.trim(); if(v){state.habits.push({id:id(),name:v,done:{}}); save()}}, deleteHabit(hid){state.habits=state.habits.filter(h=>h.id!==hid); save()}, saveGoals(){state.goals.protein=Number($('#goalProtein').value||0); state.goals.calories=Number($('#goalCalories').value||0); state.goals.weeklyWorkouts=Number($('#goalWeekly').value||0); save()}, exportData(){let text=JSON.stringify(state,null,2); navigator.clipboard&&navigator.clipboard.writeText(text); let blob=new Blob([text],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='all-in-one-fit-backup.json'; a.click();}, importData(){try{let v=JSON.parse($('#importBox').value); state=v; save(); alert('Backup imported.')}catch(e){alert('That JSON backup was not valid.')} }};
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab))); render();
})();
</script>
